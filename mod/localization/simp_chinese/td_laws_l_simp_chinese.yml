 law_td_strategic_frontiers:0 "战略边疆主义"
 law_td_strategic_frontiers_desc:0 "通过有限扩张保障边境与区域安全。军方负责边疆部署，实业家参与对外建设，两者政治力量提高；外交博弈有更多回旋余地，但军费负担增加，乡村民众的影响力受到挤压。\n\n集团政治力量：武装力量 +15%, 实业家 +10%, 乡村民众 -10%。\n国家效果：外交博弈机动点 +10, 军事物资花费 +5%, 恶名产生 +10%。\n新取得州内产业吞吐量：炼钢厂 +5%, 工具工坊 +5%, 武器厂 +5%, 弹药厂 +5%, 造船厂 +5%。吞吐量同时增加投入需求与产出。\n仅限启用后新取得的普通拥有州：建设效率 +15%, 移民吸引力 +5%, 歧视产生的激进派 +5%, 生活水平下降产生的激进派 +5%, 生活水平上升产生的效忠派 +5%；原有州（包括非文化家园）不享有这些修正，遵循原版迁移与歧视法律。\n新领土取得时一次性居民反应：激进派 +3%, 效忠派 +1%（人口比例，仍受原版人数上限约束）。持续的激进/效忠修正只改变对应来源的生成量，不每月直接改变人口比例。\n实际取得已通过目标法案且宣称有效的领土后，合法性+8。完成一州接纳整合可获合法性+3。所有成果合法性持续36个月，共用期限，不叠加、不续期；失去获奖州提前移除收益，锁定期限保留。宣称或宣战本身不发放奖励。\n宣称资格：可主张相邻州，或有原版区域利益和成熟重点、且符合当前殖民或航道安全依据的远方目标。\n基础立场：强烈支持: 武装力量; 支持: 实业家, 小市民; 中立: 地主, 虔信者; 反对: 知识分子, 工会, 乡村民众。殖民政策与人文科技会调整立场。\n重点区域上限2；每区域预留行政力50、权威力25，等待6个月成熟。新宣称基础额外恶名2，另计本法律恶名倍率；逐州整合基础成本×1.0。接纳修正案通过后，为该州支付项目成本并整合一年。"
