l_simp_chinese:
 lawgroup_territorial_doctrine:0 "国家领土原则"
 lawgroup_territorial_doctrine_desc:0 "确立国家守成、恢复法理疆界、保障战略边疆或建立帝国的长期方向。不同原则改变集团政治力量、国家收益与治理负担，并决定逐目标领土法案的资格。"
 law_td_status_quo:0 "领土现状主义"
 law_td_status_quo_desc:0 "维护现有边界，把政治与行政资源用于国内建设。知识分子、工会与乡村民众得到更多影响力，军方的扩张议程受到约束；行政效率提高，但对外威望有所降低。\n\n集团政治力量：知识分子 +10%, 工会 +10%, 乡村民众 +10%, 武装力量 -10%。\n国家效果：行政力 +5%, 威望 -5%, 恶名衰减 +15%。\n新取得州内产业吞吐量：造纸厂 +5%, 食品工业 +5%, 纺织厂 +5%。吞吐量同时增加投入需求与产出。\n仅限启用后新取得的普通拥有州：建设效率 +5%, 移民吸引力 +15%, 歧视产生的激进派 -15%, 生活水平下降产生的激进派 -10%, 生活水平上升产生的效忠派 +15%；原有州（包括非文化家园）不享有这些修正，遵循原版迁移与歧视法律。\n新领土取得时一次性居民反应：激进派 +0%, 效忠派 +2%（人口比例，仍受原版人数上限约束）。持续的激进/效忠修正只改变对应来源的生成量，不每月直接改变人口比例。\n本原则不因取得外国领土直接奖励合法性。完成一州接纳整合可获合法性+3。所有成果合法性持续36个月，共用期限，不叠加、不续期；失去获奖州提前移除收益，锁定期限保留。宣称或宣战本身不发放奖励。\n宣称资格：不提出新领土宣称；仍可逐州接纳已有领土或放弃失地宣称。\n基础立场：支持: 小市民, 知识分子, 工会, 乡村民众; 中立: 地主, 实业家, 虔信者; 反对: 武装力量。殖民政策与人文科技会调整立场。\n不设扩张重点区域。新宣称基础额外恶名0，另计本法律恶名倍率；逐州整合基础成本×0.8。接纳修正案通过后，为该州支付项目成本并整合一年。"
 td_territory_status_quo:0 "领土现状主义 — 领土开发"
 law_td_historical_rights:0 "历史权利主义"
 law_td_historical_rights_desc:0 "以既有法理和主体文化家园维护国家疆界，将恢复合法领土置于无条件扩张之前。小市民、地主与宗教传统力量获得更大政治影响，国家权威增强；传统精英也因此更有能力阻碍改革。\n\n集团政治力量：小市民 +15%, 地主 +10%, 虔信者 +10%。\n国家效果：权威力 +25, 恶名产生 -10%, 恶名衰减 +5%。\n新取得州内产业吞吐量：农业 +5%, 林业 +5%。吞吐量同时增加投入需求与产出。\n仅限启用后新取得的普通拥有州：建设效率 +10%, 移民吸引力 +10%, 歧视产生的激进派 -5%, 生活水平下降产生的激进派 +0%, 生活水平上升产生的效忠派 +10%；原有州（包括非文化家园）不享有这些修正，遵循原版迁移与歧视法律。\n新领土取得时一次性居民反应：激进派 +1%, 效忠派 +2%（人口比例，仍受原版人数上限约束）。持续的激进/效忠修正只改变对应来源的生成量，不每月直接改变人口比例。\n实际取得已通过目标法案且宣称有效的领土后，合法性+6。完成一州接纳整合可获合法性+3。所有成果合法性持续36个月，共用期限，不叠加、不续期；失去获奖州提前移除收益，锁定期限保留。宣称或宣战本身不发放奖励。\n宣称资格：仅可主张已有真实宣称或主体文化家园的外国州；不凭重点区域创造历史权利。\n基础立场：强烈支持: 小市民; 支持: 武装力量, 地主, 虔信者; 中立: 实业家, 知识分子, 工会, 乡村民众。殖民政策与人文科技会调整立场。\n重点区域上限1；每区域预留行政力25、权威力0，等待6个月成熟。新宣称基础额外恶名0，另计本法律恶名倍率；逐州整合基础成本×0.8。接纳修正案通过后，为该州支付项目成本并整合一年。"
