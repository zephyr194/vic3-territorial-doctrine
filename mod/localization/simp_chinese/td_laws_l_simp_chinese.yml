 law_td_imperial_expansion:0 "帝国扩张主义"
 law_td_imperial_expansion_desc:0 "把海外扩张与国家威望列为长期国策。军方、实业家与地主共同获益，民生和改革集团的影响力下降；帝国声望提高，但军事物资更加昂贵，广泛的海外承诺也削弱行政能力。\n\n集团政治力量：武装力量 +20%, 实业家 +15%, 地主 +10%, 知识分子 -10%, 工会 -10%, 乡村民众 -10%。\n国家效果：威望 +10%, 军事物资花费 +10%, 行政力 -5%, 恶名产生 +25%。\n新取得州内产业吞吐量：煤矿 +10%, 铁矿 +10%, 铅矿 +10%, 硫矿 +10%, 炼钢厂 +10%, 工具工坊 +10%, 化工厂 +10%, 动力机械工业 +10%, 武器厂 +10%, 弹药厂 +10%, 战争机器工业 +10%, 造船厂 +10%。吞吐量同时增加投入需求与产出。\n仅限启用后新取得的普通拥有州：建设效率 +20%, 移民吸引力 +10%, 歧视产生的激进派 +20%, 生活水平下降产生的激进派 +10%, 生活水平上升产生的效忠派 -10%；原有州（包括非文化家园）不享有这些修正，遵循原版迁移与歧视法律。\n新领土取得时一次性居民反应：激进派 +5%, 效忠派 +0%（人口比例，仍受原版人数上限约束）。持续的激进/效忠修正只改变对应来源的生成量，不每月直接改变人口比例。\n实际取得已通过目标法案且宣称有效的领土后，合法性+12。完成一州接纳整合可获合法性+3。所有成果合法性持续36个月，共用期限，不叠加、不续期；失去获奖州提前移除收益，锁定期限保留。宣称或宣战本身不发放奖励。\n宣称资格：可对已有原版利益且重点区域已成熟的合格外国州提出主张；每个目标仍须单独通过宣称法案。\n基础立场：支持: 武装力量, 地主, 实业家; 中立: 小市民, 虔信者; 反对: 乡村民众; 强烈反对: 知识分子, 工会。殖民政策与人文科技会调整立场。\n重点区域上限3；每区域预留行政力75、权威力50，等待12个月成熟。新宣称基础额外恶名5，另计本法律恶名倍率；逐州整合基础成本×1.25。接纳修正案通过后，为该州支付项目成本并整合一年。"
