l_simp_chinese:
 lawgroup_territorial_doctrine:0 "VTD 国家领土原则"
 lawgroup_territorial_doctrine_desc:0 "VTD 确立国家守成、恢复法理疆界、保障战略边疆或建立帝国的长期方向。不同原则提供理由与集团偏好的背景，具体利益与付费承诺在逐目标国内审议中处理。"
 law_td_status_quo:0 "VTD 领土现状主义"
 law_td_status_quo_desc:0 "VTD 维护现有边界，把政治与行政资源用于国内建设。这一原则仅提供领土理由与集团偏好的背景，不直接增加产能、政治力量或合法性。\n\n宣称资格：不提出新领土宣称；仍可逐州接纳已有领土或放弃失地宣称。\n初始偏好：支持: 小市民, 知识分子, 工会, 乡村民众; 中立: 地主, 实业家, 虔信者; 反对: 武装力量。实际支持另计理由、殖民政策、人文科技、集团对政府的认可、领袖立场、付费承诺与违约。无免费产业、建设、移民、人口或国家属性修正；不额外增加恶名或厌战。每90天一轮国内谈判，三成通过、三败否决。接纳仍逐州审核、付款后整合一年。"
 td_territory_status_quo:0 "VTD 领土现状主义 — 领土开发"
 law_td_historical_rights:0 "VTD 历史权利主义"
 law_td_historical_rights_desc:0 "VTD 以既有法理和主体文化家园维护国家疆界，将恢复合法领土置于无条件扩张之前。这一原则仅提供领土理由与集团偏好的背景，不直接增加产能、政治力量或合法性。\n\n宣称资格：仅可主张已有真实宣称或主体文化家园的外国州；不凭重点区域创造历史权利。\n初始偏好：强烈支持: 小市民; 支持: 武装力量, 地主, 虔信者; 中立: 实业家, 知识分子, 工会, 乡村民众。实际支持另计理由、殖民政策、人文科技、集团对政府的认可、领袖立场、付费承诺与违约。无免费产业、建设、移民、人口或国家属性修正；不额外增加恶名或厌战。每90天一轮国内谈判，三成通过、三败否决。接纳仍逐州审核、付款后整合一年。"
 td_focus_historical_rights:0 "VTD 历史权利主义 — 重点区域预留"
 td_territory_historical_rights:0 "VTD 历史权利主义 — 领土开发"
 law_td_strategic_frontiers:0 "VTD 战略边疆主义"
 law_td_strategic_frontiers_desc:0 "VTD 通过有限扩张保障边境与区域安全。这一原则仅提供领土理由与集团偏好的背景，不直接增加产能、政治力量或合法性。\n\n宣称资格：可主张相邻州，或有原版区域利益、且符合当前殖民或航道安全依据的远方目标。\n初始偏好：强烈支持: 武装力量; 支持: 实业家, 小市民; 中立: 地主, 虔信者; 反对: 知识分子, 工会, 乡村民众。实际支持另计理由、殖民政策、人文科技、集团对政府的认可、领袖立场、付费承诺与违约。无免费产业、建设、移民、人口或国家属性修正；不额外增加恶名或厌战。每90天一轮国内谈判，三成通过、三败否决。接纳仍逐州审核、付款后整合一年。"
 td_focus_strategic_frontiers:0 "VTD 战略边疆主义 — 重点区域预留"
 td_territory_strategic_frontiers:0 "VTD 战略边疆主义 — 领土开发"
 law_td_imperial_expansion:0 "VTD 帝国扩张主义"
 law_td_imperial_expansion_desc:0 "VTD 把海外扩张与国家威望列为长期国策。这一原则仅提供领土理由与集团偏好的背景，不直接增加产能、政治力量或合法性。\n\n宣称资格：可对已有原版区域利益的合格外国州提出主张；每个目标仍须单独通过宣称法案。\n初始偏好：支持: 武装力量, 地主, 实业家; 中立: 小市民, 虔信者; 反对: 乡村民众; 强烈反对: 知识分子, 工会。实际支持另计理由、殖民政策、人文科技、集团对政府的认可、领袖立场、付费承诺与违约。无免费产业、建设、移民、人口或国家属性修正；不额外增加恶名或厌战。每90天一轮国内谈判，三成通过、三败否决。接纳仍逐州审核、付款后整合一年。"
 td_focus_imperial_expansion:0 "VTD 帝国扩张主义 — 重点区域预留"
 td_territory_imperial_expansion:0 "VTD 帝国扩张主义 — 领土开发"
 td_success_admission:0 "VTD 完成逐州接纳的政治信誉"
 ideology_td_armed_forces:0 "VTD 武装力量的领土立场"
 ideology_td_armed_forces_desc:0 "VTD 重视国防部署与军方影响力，偏向战略边疆，反对削弱军事议程的守成政策。\n基础立场：领土现状主义: 反对; 历史权利主义: 支持; 战略边疆主义: 强烈支持; 帝国扩张主义: 支持。具体法案另计目标条件与承诺。"
 ideology_td_landowners:0 "VTD 地主的领土立场"
 ideology_td_landowners_desc:0 "VTD 维护土地、传统权利与精英地位，倾向历史权利和帝国扩张。\n基础立场：领土现状主义: 中立; 历史权利主义: 支持; 战略边疆主义: 中立; 帝国扩张主义: 支持。具体法案另计目标条件与承诺。"
 ideology_td_industrialists:0 "VTD 实业家的领土立场"
 ideology_td_industrialists_desc:0 "VTD 寻求对外市场与建设机会，偏向边疆和帝国扩张，重视殖民政策的商业取舍。\n基础立场：领土现状主义: 中立; 历史权利主义: 中立; 战略边疆主义: 支持; 帝国扩张主义: 支持。具体法案另计目标条件与承诺。"
 ideology_td_petty_bourgeoisie:0 "VTD 小市民的领土立场"
 ideology_td_petty_bourgeoisie_desc:0 "VTD 强调国家认同与合法疆界，最重视历史权利，也支持有限边疆政策。\n基础立场：领土现状主义: 支持; 历史权利主义: 强烈支持; 战略边疆主义: 支持; 帝国扩张主义: 中立。具体法案另计目标条件与承诺。"
 ideology_td_intelligentsia:0 "VTD 知识分子的领土立场"
 ideology_td_intelligentsia_desc:0 "VTD 重视居民权利与国内改革，倾向现状主义，反对帝国扩张；人文科技提高接纳意愿。\n基础立场：领土现状主义: 支持; 历史权利主义: 中立; 战略边疆主义: 反对; 帝国扩张主义: 强烈反对。具体法案另计目标条件与承诺。"
 ideology_td_trade_unions:0 "VTD 工会的领土立场"
 ideology_td_trade_unions_desc:0 "VTD 重视劳工权利与公共服务，反对扩张挤占民生资源，支持给予新居民平等权利。\n基础立场：领土现状主义: 支持; 历史权利主义: 中立; 战略边疆主义: 反对; 帝国扩张主义: 强烈反对。具体法案另计目标条件与承诺。"
 ideology_td_rural_folk:0 "VTD 乡村民众的领土立场"
 ideology_td_rural_folk_desc:0 "VTD 重视土地生活与低征兵负担，倾向守成，警惕持续扩张带来的战争与财政压力。\n基础立场：领土现状主义: 支持; 历史权利主义: 中立; 战略边疆主义: 反对; 帝国扩张主义: 反对。具体法案另计目标条件与承诺。"
 ideology_td_devout:0 "VTD 虔信者的领土立场"
 ideology_td_devout_desc:0 "VTD 重视传统共同体与历史合法性，偏向历史权利；殖民政策与人文发展会调整其立场。\n基础立场：领土现状主义: 中立; 历史权利主义: 支持; 战略边疆主义: 中立; 帝国扩张主义: 中立。具体法案另计目标条件与承诺。"
