 td_success_admission:0 "完成逐州接纳的政治信誉"
 ideology_td_armed_forces:0 "武装力量的领土立场"
 ideology_td_armed_forces_desc:0 "重视国防部署与军方影响力，偏向战略边疆，反对削弱军事议程的守成政策。\n基础立场：领土现状主义: 反对; 历史权利主义: 支持; 战略边疆主义: 强烈支持; 帝国扩张主义: 支持。具体法案另计目标条件与承诺。"
 ideology_td_landowners:0 "地主的领土立场"
 ideology_td_landowners_desc:0 "维护土地、传统权利与精英地位，倾向历史权利和帝国扩张。\n基础立场：领土现状主义: 中立; 历史权利主义: 支持; 战略边疆主义: 中立; 帝国扩张主义: 支持。具体法案另计目标条件与承诺。"
 ideology_td_industrialists:0 "实业家的领土立场"
 ideology_td_industrialists_desc:0 "寻求对外市场与建设机会，偏向边疆和帝国扩张，重视殖民政策的商业取舍。\n基础立场：领土现状主义: 中立; 历史权利主义: 中立; 战略边疆主义: 支持; 帝国扩张主义: 支持。具体法案另计目标条件与承诺。"
 ideology_td_petty_bourgeoisie:0 "小市民的领土立场"
 ideology_td_petty_bourgeoisie_desc:0 "强调国家认同与合法疆界，最重视历史权利，也支持有限边疆政策。\n基础立场：领土现状主义: 支持; 历史权利主义: 强烈支持; 战略边疆主义: 支持; 帝国扩张主义: 中立。具体法案另计目标条件与承诺。"
 ideology_td_intelligentsia:0 "知识分子的领土立场"
 ideology_td_intelligentsia_desc:0 "重视居民权利与国内改革，倾向现状主义，反对帝国扩张；人文科技提高接纳意愿。\n基础立场：领土现状主义: 支持; 历史权利主义: 中立; 战略边疆主义: 反对; 帝国扩张主义: 强烈反对。具体法案另计目标条件与承诺。"
 ideology_td_trade_unions:0 "工会的领土立场"
 ideology_td_trade_unions_desc:0 "重视劳工权利与公共服务，反对扩张挤占民生资源，支持给予新居民平等权利。\n基础立场：领土现状主义: 支持; 历史权利主义: 中立; 战略边疆主义: 反对; 帝国扩张主义: 强烈反对。具体法案另计目标条件与承诺。"
 ideology_td_rural_folk:0 "乡村民众的领土立场"
 ideology_td_rural_folk_desc:0 "重视土地生活与低征兵负担，倾向守成，警惕持续扩张带来的战争与财政压力。\n基础立场：领土现状主义: 支持; 历史权利主义: 中立; 战略边疆主义: 反对; 帝国扩张主义: 反对。具体法案另计目标条件与承诺。"
 ideology_td_devout:0 "虔信者的领土立场"
 ideology_td_devout_desc:0 "重视传统共同体与历史合法性，偏向历史权利；殖民政策与人文发展会调整其立场。\n基础立场：领土现状主义: 中立; 历史权利主义: 支持; 战略边疆主义: 中立; 帝国扩张主义: 中立。具体法案另计目标条件与承诺。"
