l_simp_chinese:
 td_enable_fiscal_accounting:0 "VTD 永久启用领土财政核算"
 td_enable_fiscal_accounting_desc:0 "VTD 为整个存档所有国家永久开启此模块；必须先启用国家领土原则。没有关闭入口。扩张计划与和平阶段可变化，原有合同和债务继续承担。 读取实际税制与周预算缺口，可按收支条件调整原版税档；当前法案中的实际加税会影响承担负担集团的支持。"
 td_enable_recruitment_accounting:0 "VTD 永久启用征募政治响应"
 td_enable_recruitment_accounting_desc:0 "VTD 为整个存档所有国家永久开启此模块；必须先启用国家领土原则。没有关闭入口。扩张计划与和平阶段可变化，原有合同和债务继续承担。 已批准扩张计划、扩张原则且作为进攻方战争领袖时，根据合法性相对调整征募潜力，最多±10%；和平与防御不产生此项修正。"
 td_enable_services_accounting:0 "VTD 永久启用公共服务责任核算"
 td_enable_services_accounting_desc:0 "VTD 为整个存档所有国家永久开启此模块；必须先启用国家领土原则。没有关闭入口。扩张计划与和平阶段可变化，原有合同和债务继续承担。 读取原版教育/医疗投入及行政缺口，实际投入减少或行政不足进入集团谈判；和平仍显示恢复缺口。机构投入由实际政策决定。"
 td_civic_accounts:0 "VTD 查看领土财政、征募与服务账目"
 td_civic_accounts_desc:0 "VTD 查看永久模块状态与实际原版预算、税制、行政余额和机构投入。数字是当前观测，不是未来税收预测。未开启模块不产生额外效果。"
 td_raise_budget_tax:0 "VTD 赤字预算：提高一档原版税负"
 td_raise_budget_tax_desc:0 "VTD 财政模块开启且实际周预算为负时，可真实提高一档原版税负。30天内不重复调整。税制法律保持，实际税收与生活影响由原版计算；当前法案读取真实增加的负担。"
 td_lower_budget_tax:0 "VTD 盈余预算：降低一档原版税负"
 td_lower_budget_tax_desc:0 "VTD 周预算为正且有黄金储备时，可真实降低一档税负；30天内不重复调整。盈余不是保证降税后仍有盈余，须观察下一次原版预算。不会制造额外支持或退款。"
 td_return_peace_budget:0 "VTD 结束扩张计划，转入和平预算"
 td_return_peace_budget_desc:0 "VTD 结束临时扩张计划及其征募修正；正在审议的扩张法案须先处理。永久模块、债务、年度接纳和已批准建设合同保留。新扩张计划须重新通过目标法案，不能免费恢复旧动员修正。"
 td_conscription_high_trust:0 "VTD 扩张动员：高合法性征募"
 td_conscription_low_trust:0 "VTD 扩张动员：低合法性征募"
 td_conscription_high_trust_desc:0 "VTD 批准扩张计划且作为进攻方战争领袖时，征募潜力最多相对增加10%；具体数值依合法性计算，不自动征兵，军事制度和人口继续限制实际兵力。"
 td_conscription_low_trust_desc:0 "VTD 相同动员条件下，低合法性最多相对减少10%征募潜力；和平、防御方与没有批准计划时无此修正。"
 td.40.t:0 "VTD 领土政策账目"
 td.40.d:0 "VTD 永久模块（1开启/0关闭）：财政[ROOT.GetCountry.MakeScope.Var('td_account_fiscal_enabled').GetValue]，征募[ROOT.GetCountry.MakeScope.Var('td_account_recruitment_enabled').GetValue]，服务[ROOT.GetCountry.MakeScope.Var('td_account_services_enabled').GetValue]。阶段（1扩张/0和平）：[ROOT.GetCountry.MakeScope.Var('td_civic_phase').GetValue]。\n\n原版周余额：[ROOT.GetCountry.MakeScope.Var('td_weekly_balance').GetValue]；周支出：[ROOT.GetCountry.MakeScope.Var('td_weekly_expenses').GetValue]；周缺口：[ROOT.GetCountry.MakeScope.Var('td_weekly_funding_gap').GetValue]。税档（1最低至5最高）：[ROOT.GetCountry.MakeScope.Var('td_budget_tax_rank').GetValue]；税制（0未知/1土地/2人头/3消费/4比例/5累进）：[ROOT.GetCountry.MakeScope.Var('td_budget_tax_law').GetValue]。\n\n可用行政：[ROOT.GetCountry.MakeScope.Var('td_bureaucracy_balance').GetValue]；行政缺口：[ROOT.GetCountry.MakeScope.Var('td_bureaucracy_gap').GetValue]；缺口占使用量：[ROOT.GetCountry.MakeScope.Var('td_service_pressure_percent').GetValue]%。教育/医疗投入：[ROOT.GetCountry.MakeScope.Var('td_service_education').GetValue]/[ROOT.GetCountry.MakeScope.Var('td_service_health').GetValue]级；相较首次核算缺口：[ROOT.GetCountry.MakeScope.Var('td_service_education_gap').GetValue]/[ROOT.GetCountry.MakeScope.Var('td_service_health_gap').GetValue]级。该比例是预算压力指标，不是机构效率或居民服务覆盖率。\n\n征募修正实际开启：[ROOT.GetCountry.MakeScope.Var('td_recruitment_active').GetValue]；相对征募潜力变化：[ROOT.GetCountry.MakeScope.Var('td_recruitment_percent').GetValue]%。原版军队费用与服务机构费用只记账，不重复收取。具体国家、人口税负与未来项目收益尚未估算。"
