 td_allocate_religious_schools:0 "VTD 宗教办学扩展"
 td_allocate_religious_schools_desc:0 "VTD 实际支付与建设合同同额的准备费并持续预留10行政力。每法案共两项分配槽位；未批准取消费用不退。机构条款须提高实际机构投入一级并让绑定州正式整合；保障条款须维持已记录制度/低税至少一年。外国目标最多等五年取得，再开始履约；国家制度变更会取消未批准条款或追责已批准义务。支持是预期机会，不是已经扩权、获利或居民改宗。"
