l_simp_chinese:
 td_journal_group:0 "领土立法"
 je_td_bill:0 "逐州领土法案"
 je_td_bill_reason:0 "目标：[ROOT.GetCountry.MakeScope.Var('td_bill_target').GetState.GetName]。每90天一轮，3成通过、3败否决。成功：[ROOT.GetCountry.MakeScope.Var('td_successes').GetValue]；失败：[ROOT.GetCountry.MakeScope.Var('td_failures').GetValue]。本次仅审核固定的目标。"
 je_td_integration:0 "《[ROOT.GetCountry.MakeScope.Var('td_project_target').GetState.GetName]接纳修正案》一年整合"
 je_td_integration_reason:0 "项目州：[ROOT.GetCountry.MakeScope.Var('td_project_target').GetState.GetName]。已记录月份：[ROOT.GetCountry.MakeScope.Var('td_valid_months').GetValue]/12；按项目开始后一个日历年完成。动乱、市场接入、政府合法性及文化接受程度不延长已批准的法律期限；丢失主权则取消该州项目。"
 td_remove_focus:0 "撤回全部领土重点区域"
 td_remove_focus_desc:0 "释放所有重点区域行政力与权威力，清除成熟记录并使旧等待事件失效。既往通过的宣称仍有记录；审议法案时不能撤回。"
 td_claim_al_rif:0 "提出阿尔里夫宣称法案"
 td_claim_al_rif_desc:0 "西班牙进入同一逐州宣称流程的快捷入口。远方目标需要已成熟的北非重点区域，可在理由菜单中指定。原版外交与战争目标保留。"
 td_pledge_navy:0 "承诺扩建阿尔里夫海军基地"
 td_pledge_navy_desc:0 "武装力量支持分+10。通过后，取得完整主权起3年内须较取得时净增至少1级海军基地；未兑现则认可度-5及后续支持分-10，持续5年。已有未履行的同集团承诺不能重复作出。"
 td_pledge_railway:0 "承诺扩建阿尔里夫铁路"
 td_pledge_railway_desc:0 "实业家支持分+10。通过后，取得完整主权起3年内须较取得时净增至少1级铁路；未兑现则认可度-5及后续支持分-10，持续5年。已有未履行的同集团承诺不能重复作出。"
 td_bill_status:0 "查看领土法案支持情况"
 td_bill_status_desc:0 "重新读取支持率；国家与权力体制共用10%基础率，仅理由匹配产生体制修正。查看不产生新轮次。"
 td_cancel_bill:0 "撤回领土法案"
 td_cancel_bill_desc:0 "清除正在审议的法案，并进入2年冷却。已通过法案的承诺仍须兑现。"
 td_refresh_integration:0 "刷新所选州接纳检查"
 td_refresh_integration_desc:0 "读取所选州的实际人口接受及宗教歧视状况，不修改居民文化或宗教。"
 td_project_cost:0 "领土整合项目行政成本"
 td_pledge_fulfilled:0 "领土承诺已兑现"
 td_pledge_broken:0 "领土承诺违约"
 td.flavor:0 "国内立法不能替代主权、国际外交或居民的实际权利。"
 td.close:0 "知悉"
 td.10.t:0 "领土法案支持情况"
 td.10.d:0 "目标：[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]。共同基础率：10%。支持力量：[ROOT.GetCountry.MakeScope.Var('td_support').GetValue]%；反对力量：[ROOT.GetCountry.MakeScope.Var('td_opposition').GetValue]%；下一轮：[ROOT.GetCountry.MakeScope.Var('td_chance').GetValue]%。累计成功：[ROOT.GetCountry.MakeScope.Var('td_successes').GetValue]；失败：[ROOT.GetCountry.MakeScope.Var('td_failures').GetValue]。"
 td.11.t:0 "选定领土法案通过"
 td.11.d:0 "选定州区域已具备宣称并记录立法批准。新增宣称恶名只支付一次，确认已有宣称不支付此项恶名。主动扩张战争需要扩张原则以及所有目标分别通过的法案；已有建设承诺继续有效。"
 td.12.t:0 "《[ROOT.GetCountry.MakeScope.Var('td_last_amendment_target').GetState.GetName]领土接纳修正案》通过"
 td.12.d:0 "仅[ROOT.GetCountry.MakeScope.Var('td_last_amendment_target').GetState.GetName]获得法律接纳。批准时本州激进派减少、效忠派增加，各按本州人口2%计算；平等权利理由为3%，受原版人数上限约束。这是一次性反应，不改变公民权与歧视法律。行政预算足够时立即开始本州一年整合；不足时保留批准结果，待通过整合决议为本州支付成本。其他州仍需各自审核，人口文化与家园保留。"
 td.13.t:0 "领土法案遭到否决"
 td.13.d:0 "已累计3次失败。2年内不能重启领土法案。本次未通过的承诺不产生义务；之前通过的承诺仍然保留。"
 td.14.t:0 "领土法案已撤回"
 td.14.d:0 "主动撤回或目标、立法资格失效。进入2年冷却；之前通过的法案承诺不会被清除。"
 td.15.t:0 "[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]一年整合完成"
 td.15.d:0 "[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]已完成一个日历年的有预算法律整合，成为本国正式州。本州修正案记录继续属于当前所有者；其他州不受影响。"
 td.17.t:0 "领土建设承诺已兑现"
 td.17.d:0 "阿尔里夫对应建筑较取得主权时净增至少1级。相关利益集团认可度+2，持续3年。"
 td.18.t:0 "领土建设承诺违约"
 td.18.d:0 "取得完整主权后3年内未完成对应建筑扩建。相关利益集团认可度-5、后续领土法案支持分-10，持续5年。丢失领土或更改法律不会重置履约期限。"
 td_select_owned:0 "提出一州领土接纳修正案"
 td_select_owned_desc:0 "逐一浏览本国拥有、未整合的非文化家园州，包括本国拥有的部分州。每次提交一份以该州命名的接纳修正案。通过仅给予这一州有预算的一年整合路线，不要求先被文化接纳；条约港需先取得普通领土主权。"
 td_renounce_lost:0 "放弃失地的领土主张"
 td_renounce_lost_desc:0 "逐州选择完全失去主权的已有宣称或主体文化家园。通过后移除该州区域宣称并登记放弃；文化家园保留。未失去的领土、已放弃的州不能选择。"
 td_select_integration:0 "为一个已批准州启动一年整合"
 td_select_integration_desc:0 "选择一块接纳修正案已通过的州，预留本州年度行政成本。只让这一州在一个日历年后完成整合，不设文化接受门槛或动乱延时。"
 td_requires_admission:0 "须先通过本州接纳修正案"
 td.19.t:0 "失地宣称放弃法案通过"
 td.19.d:0 "已放弃[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]所在州区域的宣称，并登记该地区的放弃结果。本模组不会通过历史权利理由自动恢复该宣称。文化家园和当前土地所有权均未改变。"
 td.20.t:0 "《[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]领土法案》选择理由"
 td.20.d:0 "所选州：[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]。选择合格理由或浏览下一个州。接纳修正案只审核这一块拥有的州，通过后进入有预算的一年整合；远方宣称须先成熟重点区域。仅选理由不开始审议。"
 td.21.t:0 "复核单州法案"
 td.21.d:0 "目标：[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]。共同基础率10%；理由修正[ROOT.GetCountry.MakeScope.Var('td_preview_reason_bonus').GetValue]点；新增宣称恶名[ROOT.GetCountry.MakeScope.Var('td_preview_infamy').GetValue]，已计原则恶名倍率。未来一年整合预计行政力[ROOT.GetCountry.MakeScope.Var('td_preview_fast_cost').GetValue]，取得主权后重算。殖民扩张/接纳倾向[ROOT.GetCountry.MakeScope.Var('td_expansion_pull').GetValue]/[ROOT.GetCountry.MakeScope.Var('td_admission_pull').GetValue]用于集团分数，不改变基础率。放弃宣称不启动整合。"
 td.22.t:0 "《[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]接纳修正案》启动整合"
 td.22.d:0 "本州须已单独通过修正案，并有足够行政力支付年度项目成本。支付后按一个日历年完成。文化接受、动乱、战损影响成本，政局影响审议；这些都不延长已批准且已支付的整合期限。"
 td.next_state:0 "查看下一个候选州"
 td.cancel_menu:0 "暂不提交"
 td.change_reason:0 "重新选择理由"
 td.submit_bill:0 "只提交这一州的法案或修正案"
 td.fast_track:0 "支付本州成本并开始一年法律整合"
 td.reason.security:0 "边疆与航道安全"
 td.reason.historical_right:0 "已有法理权利"
 td.reason.equal_rights:0 "居民平等权利"
 td.reason.civil_administration:0 "正式行政接管"
 td.reason.peace_settlement:0 "承认边界与和平解决"
 td_enable_doctrine:0 "启用国家领土原则"
 td_enable_doctrine_desc:0 "此决议出现即说明模组已加载。为本存档所有国家启用领土法律、逐州接纳、殖民政治与战争授权。默认关闭，AI不能启用；本测试档启用后不提供关闭。已经开始的战争不追溯惩罚。"
 td_mod_status:0 "国家领土原则：安装与政策状态"
 td_mod_status_desc:0 "显示模组是否启用及殖民、人文政策数值。语言随游戏设置；英语是未翻译语言的默认回退文本。"
 td_select_claim:0 "选择一块领土宣称或战争授权目标"
 td_select_claim_desc:0 "逐一浏览合格的外国州，选择有依据的理由并通过法案。已有原版宣称也要经过立法才能成为扩张授权，但不重复支付新增宣称恶名。远方目标需预留重点区域资源并完成等待。"
 td.23.t:0 "国家领土原则已启用"
 td.23.d:0 "模组已加载并为本存档启用。人文阶段 [ROOT.GetCountry.MakeScope.Var('td_humanitarian_level').GetValue]/2；殖民扩张/接纳倾向 [ROOT.GetCountry.MakeScope.Var('td_expansion_pull').GetValue]/[ROOT.GetCountry.MakeScope.Var('td_admission_pull').GetValue]。征服和吞并需要扩张原则与所有目标分别通过的法案。缺少授权的进攻方战争领袖每月额外增加2点厌战度，每场上限20；防御与归还领土战争豁免。"
 td.24.t:0 "国家领土原则已开启"
 td.24.d:0 "本存档所有国家现在启用领土法律与政治，默认领土现状主义。接纳每次处理一州。殖民政策与人文科技会改变政治倾向；主动扩张战争开始前应取得目标授权。已经开始的战争不追溯惩罚；本界面不提供撤回启用。"
 td.26.t:0 "模组已加载，领土原则尚未启用"
 td.26.d:0 "已检测到模组，但法律组、接纳限制、殖民政治和战争惩罚仍关闭。使用“启用国家领土原则”决议为本存档开启。语言随游戏设置，尚未翻译的语言目录使用英语。"
 td.designate_focus:0 "指定此目标所属重点区域"
 td.reason.colonial_development:0 "殖民开发与迁居"
 td.reason.regional_interest:0 "重点区域的战略利益"
 je_td_admission_amendment:0 "《[ROOT.GetCountry.MakeScope.Var('td_bill_target').GetState.GetName]领土接纳修正案》"
 je_td_admission_amendment_reason:0 "本修正案只审核本国拥有的[ROOT.GetCountry.MakeScope.Var('td_bill_target').GetState.GetName]，也包括本国拥有的部分州。三轮政治审议成功后批准，记录本州的接纳结果，并启动有行政预算的一年整合项目。其他州须分别审议，不要求居民先被文化接纳。"
 td_admission_ratified:0 "本州接纳修正案已批准"
 td_annual_integration:0 "本州接纳修正案：一年整合中"
 td.30.t:0 "复核《[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]领土接纳修正案》"
 td.30.d:0 "唯一目标为本国拥有的[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]。共同基础率10%，理由修正[ROOT.GetCountry.MakeScope.Var('td_preview_reason_bonus').GetValue]点；预计年度行政力预留[ROOT.GetCountry.MakeScope.Var('td_preview_fast_cost').GetValue]。通过后本州获得法律接纳，预算足够时立即开始一年整合。其他州以及同一州区域内他国拥有的部分均不会获得批准。"
 td.31.t:0 "暂无合格领土目标"
 td.31.d:0 "当前没有可用的合格目标，或原选定州已发生变化。请检查国家领土原则、区域利益和州的主权归属，再通过决议选择合格目标。本次未提交法案，也未预留行政成本。"
