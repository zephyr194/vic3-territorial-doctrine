l_simp_chinese:
 td_journal_group:0 "领土立法"
 je_td_bill:0 "阿尔里夫领土法案"
 je_td_bill_reason:0 "每90天结算一轮，累计3次成功通过或3次失败否决。\n当前成功：[ROOT.GetCountry.MakeScope.Var('td_successes').GetValue]，失败：[ROOT.GetCountry.MakeScope.Var('td_failures').GetValue]。\n可通过决议查看支持率、作出承诺或取消法案。"
 je_td_integration:0 "阿尔里夫行政整合"
 je_td_integration_reason:0 "快轨累计12个合格月份；连续6个月不合格则转回常规整合。\n合格月份：[ROOT.GetCountry.MakeScope.Var('td_valid_months').GetValue]；连续不合格：[ROOT.GetCountry.MakeScope.Var('td_invalid_months').GetValue]。\n常规路线需在原版州界面手动启动整合。文化与宗教不会改变。"
 td_focus_north_africa:0 "指定北非为重点区域"
 td_focus_north_africa_desc:0 "需已有区域利益；按法律持续预留行政力与权威力，等待6或12个月。首版仅开放这一个重点区域。历史权利主义不能据此制造阿尔里夫历史权利。"
 td_remove_focus:0 "撤销北非重点区域"
 td_remove_focus_desc:0 "释放区域预留资源。正在审议法案时不可撤销；重新指定需重新等待。"
 td_claim_al_rif:0 "提出阿尔里夫宣称法案"
 td_claim_al_rif_desc:0 "以直布罗陀海峡安全为依据，推动领土宣称。首版要求摩洛哥仍持有该州，并采用边疆或帝国原则且重点区域已就绪。不会自动取得土地。"
 td_admit_al_rif:0 "提出阿尔里夫正式接纳法案"
 td_admit_al_rif_desc:0 "需拥有整个州区域的主权。单纯军事占领不足；通过后也不会自动取消文化与宗教歧视。"
 td_pledge_navy:0 "承诺扩建阿尔里夫海军基地"
 td_pledge_navy_desc:0 "武装力量支持分+10。通过后，取得完整主权起3年内须较取得时净增至少1级海军基地；未兑现则认可度-5及后续支持分-10，持续5年。已有未履行的同集团承诺不能重复作出。"
 td_pledge_railway:0 "承诺扩建阿尔里夫铁路"
 td_pledge_railway_desc:0 "实业家支持分+10。通过后，取得完整主权起3年内须较取得时净增至少1级铁路；未兑现则认可度-5及后续支持分-10，持续5年。已有未履行的同集团承诺不能重复作出。"
 td_bill_status:0 "查看领土法案支持情况"
 td_bill_status_desc:0 "重新计算各集团立场和下一轮成功率；不推进轮次，也不重新抽签。"
 td_cancel_bill:0 "撤回领土法案"
 td_cancel_bill_desc:0 "清除正在审议的法案，并进入2年冷却。已通过法案的承诺仍须兑现。"
 td_fast_integration:0 "启动阿尔里夫一年行政整合"
 td_fast_integration_desc:0 "需合法性≥60、支付成本后行政力≥0、动乱<20%、战损<10%、市场接入≥90%，且至少80%人口充分接受并且宗教不受歧视。支付两倍项目行政成本，累计12个合格月后成为正式州。"
 td_regular_integration:0 "选择阿尔里夫常规整合"
 td_regular_integration_desc:0 "预留常规项目行政力。随后必须在原版州界面点击整合，速度沿用原版。"
 td_refresh_integration:0 "刷新阿尔里夫人口接纳检查"
 td_refresh_integration_desc:0 "即时读取实际人口接受与宗教歧视条件；平时每月自动刷新。"
 td_project_cost:0 "领土整合项目行政成本"
 td_pledge_fulfilled:0 "领土承诺已兑现"
 td_pledge_broken:0 "领土承诺违约"
 td.flavor:0 "国内立法不能替代主权、国际外交或居民的实际权利。"
 td.close:0 "知悉"
 td.10.t:0 "领土法案支持情况"
 td.10.d:0 "支持政治力量：[ROOT.GetCountry.MakeScope.Var('td_support').GetValue]%\n反对政治力量：[ROOT.GetCountry.MakeScope.Var('td_opposition').GetValue]%\n下一轮成功率：[ROOT.GetCountry.MakeScope.Var('td_chance').GetValue]%\n累计成功：[ROOT.GetCountry.MakeScope.Var('td_successes').GetValue]；失败：[ROOT.GetCountry.MakeScope.Var('td_failures').GetValue]。每轮90天，3次成功通过、3次失败否决。"
 td.11.t:0 "阿尔里夫宣称法案通过"
 td.11.d:0 "已添加对阿尔里夫的领土宣称，并支付相应额外恶名。外交博弈、战争目标恶名和取得主权仍沿用原版。通过的建设承诺会在取得整个州区域主权后开始计时。"
 td.12.t:0 "阿尔里夫接纳法案通过"
 td.12.d:0 "可以选择常规整合，或在满足实际治理与人口接纳门槛时启动一年快轨。此法案不会改变文化、宗教或接受等级。"
 td.13.t:0 "领土法案遭到否决"
 td.13.d:0 "已累计3次失败。2年内不能重启领土法案。本次未通过的承诺不产生义务；之前通过的承诺仍然保留。"
 td.14.t:0 "领土法案已撤回"
 td.14.d:0 "主动撤回或目标、立法资格失效。进入2年冷却；之前通过的法案承诺不会被清除。"
 td.15.t:0 "阿尔里夫完成行政整合"
 td.15.d:0 "累计完成12个合格月份，阿尔里夫已成为正式州，项目行政成本已释放。当地人口文化与宗教保留，已通过的建设承诺继续追踪。"
 td.16.t:0 "快轨转回常规整合"
 td.16.d:0 "连续6个月治理条件不合格。已改为预留常规行政成本；请在原版州界面启动整合。此项目不能立即重开快轨。"
 td.17.t:0 "领土建设承诺已兑现"
 td.17.d:0 "阿尔里夫对应建筑较取得主权时净增至少1级。相关利益集团认可度+2，持续3年。"
 td.18.t:0 "领土建设承诺违约"
 td.18.d:0 "取得完整主权后3年内未完成对应建筑扩建。相关利益集团认可度-5、后续领土法案支持分-10，持续5年。丢失领土或更改法律不会重置履约期限。"
