l_simp_chinese:
 td_journal_group:0 "VTD 领土立法"
 je_td_bill:0 "VTD 逐州领土法案"
 je_td_bill_reason:0 "VTD 目标：[ROOT.GetCountry.MakeScope.Var('td_bill_target').GetState.GetName]。每90天一轮谈判，可支付可信建设承诺、继续或撤回；三成通过、三败否决。成功/失败：[ROOT.GetCountry.MakeScope.Var('td_successes').GetValue]/[ROOT.GetCountry.MakeScope.Var('td_failures').GetValue]"
 je_td_integration:0 "VTD 《[ROOT.GetCountry.MakeScope.Var('td_project_target').GetState.GetName]接纳修正案》一年整合"
 je_td_integration_reason:0 "VTD 项目州：[ROOT.GetCountry.MakeScope.Var('td_project_target').GetState.GetName]。已记录月份：[ROOT.GetCountry.MakeScope.Var('td_valid_months').GetValue]/12；按项目开始后一个日历年完成。动乱、市场接入、政府合法性及文化接受程度不延长已批准的法律期限；丢失主权则取消该州项目。"
 td_remove_focus:0 "VTD 撤回全部领土重点区域"
 td_remove_focus_desc:0 "VTD 释放所有重点区域行政力与权威力，清除成熟记录并使旧等待事件失效。既往通过的宣称仍有记录；审议法案时不能撤回。"
 td_claim_al_rif:0 "VTD 提出阿尔里夫宣称法案"
 td_claim_al_rif_desc:0 "VTD 西班牙的目标快捷入口，与各国通用法案遵循同一国内谈判；没有额外重点成熟等待。"
 td_pledge_navy:0 "VTD 为目标州承诺海军基地"
 td_pledge_navy_desc:0 "VTD 勘察费为目标人口×0.01且至少5000，另预留10行政力，不直接创建建筑。批准后已有主权州须三年内净增一级；外国目标取得后才开始交付，最多等五年。兑现相关集团认可+2三年；违约−5并影响未来谈判五年。"
 td_pledge_railway:0 "VTD 为目标州承诺铁路"
 td_pledge_railway_desc:0 "VTD 勘察费为目标人口×0.01且至少5000，另预留10行政力，不直接创建建筑。批准后已有主权州须三年内净增一级；外国目标取得后才开始交付，最多等五年。兑现相关集团认可+2三年；违约−5并影响未来谈判五年。"
 td_bill_status:0 "VTD 查看领土法案支持情况"
 td_bill_status_desc:0 "VTD 按现有联盟与承诺重新计算支持；所有国家与权力体制共用10%起始率。查看不产生新轮次。"
 td_cancel_bill:0 "VTD 撤回领土法案"
 td_cancel_bill_desc:0 "VTD 清除正在审议的法案，并进入2年冷却。已通过法案的承诺仍须兑现。"
 td_refresh_integration:0 "VTD 刷新所选州接纳检查"
 td_refresh_integration_desc:0 "VTD 读取所选州的实际人口接受及宗教歧视状况，不修改居民文化或宗教。"
 td_project_cost:0 "VTD 领土整合项目行政成本"
 td_pledge_fulfilled:0 "VTD 领土承诺已兑现"
 td_pledge_broken:0 "VTD 领土承诺违约"
 td.flavor:0 "VTD 国内立法不能替代主权、国际外交或居民的实际权利。"
 td.close:0 "VTD 知悉"
 td.10.t:0 "VTD 领土法案支持情况"
 td.10.d:0 "VTD 目标：[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]。共同基础率：10%。支持力量：[ROOT.GetCountry.MakeScope.Var('td_support').GetValue]%；反对力量：[ROOT.GetCountry.MakeScope.Var('td_opposition').GetValue]%；下一轮：[ROOT.GetCountry.MakeScope.Var('td_chance').GetValue]%。累计成功：[ROOT.GetCountry.MakeScope.Var('td_successes').GetValue]；失败：[ROOT.GetCountry.MakeScope.Var('td_failures').GetValue]。"
 td.11.t:0 "VTD 选定领土法案通过"
 td.11.d:0 "VTD 选定州区域已具备宣称并记录国内批准。本法案不额外增加恶名，也不转移主权。外交和战争继续原版规则；已批准的建设承诺仍须兑现。"
 td.12.t:0 "VTD 《[SCOPE.sState('td_notice_target').GetName]领土接纳修正案》通过"
 td.12.d:0 "VTD 仅[SCOPE.sState('td_notice_target').GetName]获得本州法律批准。预算与项目槽位允许时开始一年行政整合；否则保留批准等待付款。没有自动改变人口文化、接受等级、激进派或效忠派。建设承诺仍须实际履行。"
 td.13.t:0 "VTD 领土法案遭到否决"
 td.13.d:0 "VTD 已累计三次失败，领土法案进入两年冷却。未批准合同释放规划预留，勘察费不退；以前已经批准的合同仍须兑现。"
 td.14.t:0 "VTD 领土法案已撤回"
 td.14.d:0 "VTD 主动撤回或目标、立法资格失效，进入两年冷却。未批准合同释放规划预留且勘察费不退；以前已经批准的合同保留。"
 td.15.t:0 "VTD [SCOPE.sState('td_notice_target').GetName]一年整合完成"
 td.15.d:0 "VTD [SCOPE.sState('td_notice_target').GetName]已完成一个日历年的有预算法律整合，成为本国正式州。本州修正案记录继续属于当前所有者；其他州不受影响。"
 td.17.t:0 "VTD 领土建设承诺已兑现"
 td.17.d:0 "VTD 目标州的净新增建筑已达到承诺，相关集团给予有限的暂时认可，行政规划预留已释放。没有免费增加产能或合法性。"
 td.18.t:0 "VTD 领土建设承诺违约"
 td.18.d:0 "VTD 已取得主权的目标州未在交付期限内完成承诺。相关集团的政府认可和未来谈判信用下降，行政规划预留已释放；读档、失地或换原则不会延后旧期限。"
 td_select_owned:0 "VTD 提出一州领土接纳修正案"
 td_select_owned_desc:0 "VTD 逐一浏览本国拥有、未整合的非文化家园州，包括本国拥有的部分州。每次提交一份以该州命名的接纳修正案。通过仅给予这一州有预算的一年整合路线，不要求先被文化接纳；条约港需先取得普通领土主权。"
 td_renounce_lost:0 "VTD 放弃失地的领土主张"
 td_renounce_lost_desc:0 "VTD 逐州选择完全失去主权的已有宣称或主体文化家园。通过后移除该州区域宣称并登记放弃；文化家园保留。未失去的领土、已放弃的州不能选择。"
 td_select_integration:0 "VTD 为一个已批准州启动一年整合"
 td_select_integration_desc:0 "VTD 选择一块接纳修正案已通过的州，预留本州年度行政成本。只让这一州在一个日历年后完成整合，不设文化接受门槛或动乱延时。"
 td_requires_admission:0 "VTD 须先通过本州接纳修正案"
 td.19.t:0 "VTD 失地宣称放弃法案通过"
 td.19.d:0 "VTD 已放弃[SCOPE.sState('td_notice_target').GetName]所在州区域的宣称，并登记该地区的放弃结果。本模组不会通过历史权利理由自动恢复此宣称。文化家园和当前土地所有权均未改变。"
 td.20.t:0 "VTD 《[SCOPE.sState('td_menu_target').GetName]领土法案》选择理由"
 td.20.d:0 "VTD 所选州：[SCOPE.sState('td_menu_target').GetName]。选择合格理由或浏览下一个州。接纳修正案只审核这一块拥有的州，通过后提供有预算的一年行政整合。远方宣称需要原版区域利益；仅选理由不开始审议。"
 td.21.t:0 "VTD 复核单州法案"
 td.21.d:0 "VTD 复核本目标、理由与费用。提交后每90天谈判一轮，三成通过、三败否决。国内批准不额外制造恶名，不给予免费属性。接纳的一年行政预算仍须支付；具体建设另付原版成本。"
 td.22.t:0 "VTD 《[SCOPE.sState('td_menu_target').GetName]接纳修正案》启动整合"
 td.22.d:0 "VTD 本州须已单独通过修正案，并有足够行政力承担年度预留。付款后按一个日历年完成。人口、动乱、战损影响预算，文化接受程度不设置期限或成本倍率。"
 td.next_state:0 "VTD 查看下一个候选州"
 td.cancel_menu:0 "VTD 暂不提交"
 td.change_reason:0 "VTD 重新选择理由"
 td.submit_bill:0 "VTD 只提交这一州的法案或修正案"
 td.fast_track:0 "VTD 支付本州成本并开始一年法律整合"
 td.reason.security:0 "VTD 边疆与航道安全"
 td.reason.historical_right:0 "VTD 已有法理权利"
 td.reason.equal_rights:0 "VTD 居民平等权利"
 td.reason.civil_administration:0 "VTD 正式行政接管"
 td.reason.peace_settlement:0 "VTD 承认边界与和平解决"
 td_enable_doctrine:0 "VTD 国家领土原则状态"
 td_enable_doctrine_desc:0 "VTD 主系统已随模组加载，无需手动开关。"
 td_mod_status:0 "VTD 国家领土原则：状态与知悉"
 td_mod_status_desc:0 "VTD 主系统随模组加载生效，法律组固定显示。点击查看当前国家状态；选择“知悉”后本提示不再显示。"
 td_select_claim:0 "VTD 选择一块领土宣称或战争授权目标"
 td_select_claim_desc:0 "VTD 逐一浏览合格外国州，选择有依据的理由并进行国内审议。已有原版宣称也可取得国内批准。远方目标使用原版区域利益，没有额外重点成熟等待或新增宣称恶名。"
 td.23.t:0 "VTD 国家领土原则运行状态"
 td.23.d:0 "VTD 当前国家：[ROOT.GetCountry.GetName]。主系统已运行；请在“法律 → 权力结构 → VTD 国家领土原则”查看四项原则，未指定原则的国家以维持现状起步。\n\n本国人文研究阶段：[ROOT.GetCountry.MakeScope.Var('td_humanitarian_level').GetValue]/2；殖民扩张倾向：[ROOT.GetCountry.MakeScope.Var('td_expansion_pull').GetValue]；殖民接纳倾向：[ROOT.GetCountry.MakeScope.Var('td_admission_pull').GetValue]。这些是本国审议参数，不是地区奖励。\n\n选择目标后按该州资格逐项审议；系统不自动发放全球领土增益。财政、征募、公共服务三个可选核算模块仍分别由其决议启用。点击“知悉”关闭此提示，当前国家在本存档中不再常驻此决议。"
 td.24.t:0 "VTD 国家领土原则已运行"
 td.24.d:0 "VTD 主系统随模组加载，法律组固定显示。选择具体目标后开始审议。"
 td.26.t:0 "VTD 国家领土原则已加载"
 td.26.d:0 "VTD 主系统随模组加载，无需手动启用。请查看国家领土原则法律组。"
 td.designate_focus:0 "VTD 指定此目标所属重点区域"
 td.reason.colonial_development:0 "VTD 殖民开发与迁居"
 td.reason.regional_interest:0 "VTD 区域战略利益"
 je_td_admission_amendment:0 "VTD 《[ROOT.GetCountry.MakeScope.Var('td_bill_target').GetState.GetName]领土接纳修正案》"
 je_td_admission_amendment_reason:0 "VTD 本修正案只审核本国拥有的[ROOT.GetCountry.MakeScope.Var('td_bill_target').GetState.GetName]，也包括本国拥有的部分州。三轮政治审议成功后批准，记录本州的接纳结果，并启动有行政预算的一年整合项目。其他州须分别审议，不要求居民先被文化接纳。"
 td_admission_ratified:0 "VTD 本州接纳修正案已批准"
 td_annual_integration:0 "VTD 本州接纳修正案：一年整合中"
 td.30.t:0 "VTD 复核《[SCOPE.sState('td_menu_target').GetName]领土接纳修正案》"
 td.30.d:0 "VTD 这是本州独立的接纳修正案，每90天处理一轮国内谈判。通过后预算允许时付款整合一年；其他州仍须自己的法案。居民权利依据实际公民权与宗教法律，不因选择理由自动改变。"
 td.31.t:0 "VTD 暂无合格领土目标"
 td.31.d:0 "VTD 当前没有可用的合格目标，或原选定州已发生变化。请检查国家领土原则、区域利益和州的主权归属，再通过决议选择合格目标。本次未提交法案，也未预留行政成本。"

 td_negotiate:0 "VTD 继续本轮领土谈判"

 td_negotiate_desc:0 "VTD 重新打开本法案的当前谈判；付费承诺、继续审议或撤回均只针对固定目标。关闭窗口不会自动投票。"

 td.32.t:0 "VTD 关于[SCOPE.sState('td_negotiation_target').GetName]的国内谈判"

 td.32.d:0 "VTD 成功/失败：[ROOT.GetCountry.MakeScope.Var('td_successes').GetValue]/[ROOT.GetCountry.MakeScope.Var('td_failures').GetValue]。支持/反对政治力量：[ROOT.GetCountry.MakeScope.Var('td_support').GetValue]/[ROOT.GetCountry.MakeScope.Var('td_opposition').GetValue]。本轮通过率：[ROOT.GetCountry.MakeScope.Var('td_chance').GetValue]%。你可以为本州铁路或海军基地支付勘察费用并预留10行政力，换取相关集团对可信建设承诺的支持；也可以按现有联盟继续或撤回。每份勘察费用为人口×0.01，至少5000，不退还；真实建设另由原版预算承担。铁路要求铁路科技，海军基地要求沿海。占有区域已有本国部分时，先取得普通主权再通过接纳法案承诺，避免把旧部分误认成新取得目标。 已用分配槽位：[ROOT.GetCountry.MakeScope.Var('td_bill_allocation_count').GetValue]/2。每法案最多两项分配条款，共用准备费和行政资源。新增宗教/公共教育、医疗扩展、地主制度保障与一年低税；具体条款按真实法律和机构投入履约。"

 td.negotiate.navy:0 "VTD 付费承诺建设海军基地"

 td.negotiate.railway:0 "VTD 付费承诺建设铁路"

 td.negotiate.details:0 "VTD 查看各集团诉求与评分"

 td.negotiate.continue:0 "VTD 按现有支持继续审议"

 td.negotiate.withdraw:0 "VTD 撤回并释放未批准预留"

 td.negotiate.return:0 "VTD 返回谈判"

 td.33.t:0 "VTD 本法案的利益集团账目"

 td.33.d:0 "VTD 各项是可测试的政治参数，不是历史支持率；未评估的资源收益、伤亡和工资承诺不计入支持。分数≥20强支持，5～19支持，−4～4中立，−19～−5反对，≤−20强反对。\n\n武装力量 — 总分: [ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_score').GetValue]; 初始偏好: [ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_base').GetValue]; 殖民: [ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_colonial').GetValue]; 理由与负担: [ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_target').GetValue]; 政府关系: [ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_trust').GetValue]; 领袖: [ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_leader').GetValue]; 付费承诺: [ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_funded').GetValue]; 违约: [ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_breach').GetValue]；税负：[ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_fiscal').GetValue]；服务：[ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_services').GetValue]；分配条款：[ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_allocation').GetValue]；机会事实：[ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_opportunity').GetValue]\n\n地主 — 总分: [ROOT.GetCountry.MakeScope.Var('td_view_landowners_score').GetValue]; 初始偏好: [ROOT.GetCountry.MakeScope.Var('td_view_landowners_component_base').GetValue]; 殖民: [ROOT.GetCountry.MakeScope.Var('td_view_landowners_component_colonial').GetValue]; 理由与负担: [ROOT.GetCountry.MakeScope.Var('td_view_landowners_component_target').GetValue]; 政府关系: [ROOT.GetCountry.MakeScope.Var('td_view_landowners_component_trust').GetValue]; 领袖: [ROOT.GetCountry.MakeScope.Var('td_view_landowners_component_leader').GetValue]; 付费承诺: [ROOT.GetCountry.MakeScope.Var('td_view_landowners_component_funded').GetValue]; 违约: [ROOT.GetCountry.MakeScope.Var('td_view_landowners_component_breach').GetValue]；税负：[ROOT.GetCountry.MakeScope.Var('td_view_landowners_component_fiscal').GetValue]；服务：[ROOT.GetCountry.MakeScope.Var('td_view_landowners_component_services').Ge