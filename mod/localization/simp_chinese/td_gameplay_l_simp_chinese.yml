l_simp_chinese:
 td_journal_group:0 "领土立法"
 je_td_bill:0 "逐州领土法案"
 je_td_bill_reason:0 "目标：[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]。每90天结算一轮，3成通过、3败否决。成功：[ROOT.GetCountry.MakeScope.Var('td_successes').GetValue]，失败：[ROOT.GetCountry.MakeScope.Var('td_failures').GetValue]。本次结果只处理选中的州。"
 je_td_integration:0 "单州行政整合"
 je_td_integration_reason:0 "目标：[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]。快轨有效月：[ROOT.GetCountry.MakeScope.Var('td_valid_months').GetValue]；连续不合格月：[ROOT.GetCountry.MakeScope.Var('td_invalid_months').GetValue]。12个合格月完成，连续6个月不合格转常规；常规需在州界面手动启动。"
 td_focus_north_africa:0 "指定北非为重点区域"
 td_focus_north_africa_desc:0 "需已有区域利益；按法律持续预留行政力与权威力，等待6或12个月。首版仅开放这一个重点区域。历史权利主义不能据此制造阿尔里夫历史权利。"
 td_remove_focus:0 "撤销北非重点区域"
 td_remove_focus_desc:0 "释放区域预留资源。正在审议法案时不可撤销；重新指定需重新等待。"
 td_claim_al_rif:0 "提出阿尔里夫宣称法案"
 td_claim_al_rif_desc:0 "选择有事实依据的理由，再审议阿尔里夫宣称。基础率不因体制不同而改变；理由与本国体制匹配才有修正，目标国体制影响新增恶名。原版外交与战争目标继续保留。"
 td_pledge_navy:0 "承诺扩建阿尔里夫海军基地"
 td_pledge_navy_desc:0 "武装力量支持分+10。通过后，取得完整主权起3年内须较取得时净增至少1级海军基地；未兑现则认可度-5及后续支持分-10，持续5年。已有未履行的同集团承诺不能重复作出。"
 td_pledge_railway:0 "承诺扩建阿尔里夫铁路"
 td_pledge_railway_desc:0 "实业家支持分+10。通过后，取得完整主权起3年内须较取得时净增至少1级铁路；未兑现则认可度-5及后续支持分-10，持续5年。已有未履行的同集团承诺不能重复作出。"
 td_bill_status:0 "查看领土法案支持情况"
 td_bill_status_desc:0 "重新读取支持率；国家与权力体制共用10%基础率，仅理由匹配产生体制修正。查看不产生新轮次。"
 td_cancel_bill:0 "撤回领土法案"
 td_cancel_bill_desc:0 "清除正在审议的法案，并进入2年冷却。已通过法案的承诺仍须兑现。"
 td_refresh_integration:0 "刷新所选州接纳检查"
 td_refresh_integration_desc:0 "读取所选州的实际人口接受及宗教歧视状况，不修改居民文化或宗教。"
 td_project_cost:0 "领土整合项目行政成本"
 td_pledge_fulfilled:0 "领土承诺已兑现"
 td_pledge_broken:0 "领土承诺违约"
 td.flavor:0 "国内立法不能替代主权、国际外交或居民的实际权利。"
 td.close:0 "知悉"
 td.10.t:0 "领土法案支持情况"
 td.10.d:0 "目标：[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]。共同基础率：10%。支持力量：[ROOT.GetCountry.MakeScope.Var('td_support').GetValue]%；反对力量：[ROOT.GetCountry.MakeScope.Var('td_opposition').GetValue]%；下一轮：[ROOT.GetCountry.MakeScope.Var('td_chance').GetValue]%。累计成功：[ROOT.GetCountry.MakeScope.Var('td_successes').GetValue]；失败：[ROOT.GetCountry.MakeScope.Var('td_failures').GetValue]。"
 td.11.t:0 "阿尔里夫宣称法案通过"
 td.11.d:0 "已添加对阿尔里夫的领土宣称，并支付相应额外恶名。外交博弈、战争目标恶名和取得主权仍沿用原版。通过的建设承诺会在取得整个州区域主权后开始计时。"
 td.12.t:0 "所选州正式接纳法案通过"
 td.12.d:0 "本次只接纳[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]，并只解除该州的整合限制。其他非本土州仍须分别审议。实际文化接受、宗教权利、人口文化和家园均未改变。"
 td.13.t:0 "领土法案遭到否决"
 td.13.d:0 "已累计3次失败。2年内不能重启领土法案。本次未通过的承诺不产生义务；之前通过的承诺仍然保留。"
 td.14.t:0 "领土法案已撤回"
 td.14.d:0 "主动撤回或目标、立法资格失效。进入2年冷却；之前通过的法案承诺不会被清除。"
 td.15.t:0 "所选州完成行政整合"
 td.15.d:0 "[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]已累计12个合格月并成为正式州。项目成本释放；其他州的接纳与整合状态不受影响。文化和宗教保留。"
 td.16.t:0 "快轨转回常规整合"
 td.16.d:0 "所选州连续6个月不满足快轨条件，改为预留常规成本。请在原版州界面开始整合；该项目未完成前不能再开始另一个项目。"
 td.17.t:0 "领土建设承诺已兑现"
 td.17.d:0 "阿尔里夫对应建筑较取得主权时净增至少1级。相关利益集团认可度+2，持续3年。"
 td.18.t:0 "领土建设承诺违约"
 td.18.d:0 "取得完整主权后3年内未完成对应建筑扩建。相关利益集团认可度-5、后续领土法案支持分-10，持续5年。丢失领土或更改法律不会重置履约期限。"
 td_select_owned:0 "逐州处理非本土领土"
 td_select_owned_desc:0 "选择一个实际拥有、未整合且不属于主体文化家园的州。须单独选择理由并审议；通过仅解锁该州的整合。文化接受不等于文化家园，战时占领不等于取得主权。"
 td_renounce_lost:0 "放弃失地的领土主张"
 td_renounce_lost_desc:0 "逐州选择完全失去主权的已有宣称或主体文化家园。通过后移除该州区域宣称并登记放弃；文化家园保留。未失去的领土、已放弃的州不能选择。"
 td_select_integration:0 "选择一个已接纳州进行整合"
 td_select_integration_desc:0 "只可选择本国逐州法案已接纳的州；一次开始一个项目，成本由本国体制、原统治体制和当地情况决定。"
 td_requires_admission:0 "须先通过逐州接纳法案"
 td.19.t:0 "失地宣称放弃法案通过"
 td.19.d:0 "已放弃[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]所在州区域的宣称，并登记该地区的放弃结果。本模组不会通过历史权利理由自动恢复该宣称。文化家园和当前土地所有权均未改变。"
 td.20.t:0 "选择领土法案理由"
 td.20.d:0 "所选州：[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]。每项法案只处理一州。请选择有依据的理由；所有国家与权力体制共用基础率，理由匹配后才加减分。可以查看其他候选州，尚未开始审议。"
 td.21.t:0 "复核单州法案"
 td.21.d:0 "目标：[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]。共同基础率10%；理由与体制修正：[ROOT.GetCountry.MakeScope.Var('td_preview_reason_bonus').GetValue]个百分点；宣称额外恶名：[ROOT.GetCountry.MakeScope.Var('td_preview_infamy').GetValue]。若接纳，当前估算常规成本：[ROOT.GetCountry.MakeScope.Var('td_preview_regular_cost').GetValue]行政力，快轨：[ROOT.GetCountry.MakeScope.Var('td_preview_fast_cost').GetValue]。实际项目开始时重新计算；放弃宣称不启动整合也不支付上述行政成本。"
 td.22.t:0 "选择所选州整合路线"
 td.22.d:0 "目标：[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]。快轨须合法性≥60、支付后行政力≥0、动乱<20%、战损<10%、市场接入≥90%，充分接受且宗教不受歧视的居民占比≥80%。常规路线速度沿用原版。"
 td.next_state:0 "查看下一个候选州"
 td.cancel_menu:0 "暂不提交"
 td.change_reason:0 "重新选择理由"
 td.submit_bill:0 "仅提交这个州的法案"
 td.fast_track:0 "开始一年快轨整合"
 td.regular_track:0 "开始常规整合项目"
 td.reason.security:0 "边疆与航道安全"
 td.reason.historical_right:0 "已有法理权利"
 td.reason.equal_rights:0 "居民平等权利"
 td.reason.civil_administration:0 "正式行政接管"
 td.reason.peace_settlement:0 "承认边界与和平解决"
