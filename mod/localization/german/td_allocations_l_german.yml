l_german:
 td_allocate_religious_schools:0 "VTD Religious Education Expansion"
 td_allocate_religious_schools_desc:0 "VTD Pay the same preparation fee as a construction commitment and reserve 10 bureaucracy. Two allocation slots per bill. Unratified cancellation gives no refund. Institutional clauses require one actual investment level and incorporation of the bound state; guarantees hold the recorded regime/low tax for at least one year. Foreign targets wait at most five years before delivery. Changing prerequisites cancels unratified clauses or breaches ratified ones. Support reflects opportunities, not realized political power, profit or conversion."
