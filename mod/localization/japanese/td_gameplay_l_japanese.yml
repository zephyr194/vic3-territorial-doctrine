l_japanese:
 td_journal_group:0 "Territorial Legislation"
 je_td_bill:0 "Individual Territorial Bill"
 je_td_bill_reason:0 "Target: [ROOT.GetCountry.MakeScope.Var('td_bill_target').GetState.GetName]. Negotiate every 90 days: fund credible building commitments, proceed or withdraw. Three successes pass, three failures reject. Successes/failures: [ROOT.GetCountry.MakeScope.Var('td_successes').GetValue]/[ROOT.GetCountry.MakeScope.Var('td_failures').GetValue]"
 je_td_integration:0 "One-Year Integration: [ROOT.GetCountry.MakeScope.Var('td_project_target').GetState.GetName]"
 je_td_integration_reason:0 "Funded project: [ROOT.GetCountry.MakeScope.Var('td_project_target').GetState.GetName]. Recorded months: [ROOT.GetCountry.MakeScope.Var('td_valid_months').GetValue]/12. Completion uses one calendar year from project start. Turmoil, market access, government legitimacy and cultural acceptance do not extend the legal deadline. Losing ownership cancels this project."
 td_remove_focus:0 "Withdraw All Territorial Focus Regions"
 td_remove_focus_desc:0 "Releases all focus bureaucracy and authority, clears readiness and invalidates old waiting events. Previously approved claims remain recorded. Cannot withdraw during a bill."
 td_claim_al_rif:0 "Propose an Al Rif Claim Bill"
 td_claim_al_rif_desc:0 "Spain’s target shortcut uses the same domestic negotiations available to all countries, without an additional focus-maturity wait."
 td_pledge_navy:0 "Fund a Naval-Base Commitment for the Target"
 td_pledge_navy_desc:0 "Survey cost is target population x0.01, minimum 5,000, plus 10 reserved bureaucracy; no building is created. Ratified owned-state commitments require one net level within three years. Foreign targets start delivery after acquisition, waiting at most five years. Fulfillment gives the relevant group approval +2 for three years; breach gives -5 and damages future negotiations for five years."
 td_pledge_railway:0 "Fund a Railway Commitment for the Target"
 td_pledge_railway_desc:0 "Survey cost is target population x0.01, minimum 5,000, plus 10 reserved bureaucracy; no building is created. Ratified owned-state commitments require one net level within three years. Foreign targets start delivery after acquisition, waiting at most five years. Fulfillment gives the relevant group approval +2 for three years; breach gives -5 and damages future negotiations for five years."
 td_bill_status:0 "Inspect Territorial Bill Support"
 td_bill_status_desc:0 "Recalculate support from the current coalition and commitments. All government and power structures share a 10% starting rate. Viewing does not create a round."
 td_cancel_bill:0 "Withdraw Territorial Bill"
 td_cancel_bill_desc:0 "Clears the active bill and imposes a two-year cooldown. Pledges from previously passed bills remain binding."
 td_refresh_integration:0 "Refresh Selected State Acceptance"
 td_refresh_integration_desc:0 "Read the selected state's actual acceptance and religious discrimination; cultures and religions are unchanged."
 td_project_cost:0 "Territorial Integration Project Cost"
 td_pledge_fulfilled:0 "Territorial Pledge Fulfilled"
 td_pledge_broken:0 "Territorial Pledge Broken"
 td.flavor:0 "Domestic legislation does not replace sovereignty, diplomacy or residents' actual rights."
 td.close:0 "Acknowledged"
 td.10.t:0 "Territorial Bill Support"
 td.10.d:0 "Target: [ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]. Shared base: 10%. Supporting clout: [ROOT.GetCountry.MakeScope.Var('td_support').GetValue]%; opposition: [ROOT.GetCountry.MakeScope.Var('td_opposition').GetValue]%; next round: [ROOT.GetCountry.MakeScope.Var('td_chance').GetValue]%. Successes: [ROOT.GetCountry.MakeScope.Var('td_successes').GetValue]; failures: [ROOT.GetCountry.MakeScope.Var('td_failures').GetValue]."
 td.11.t:0 "Selected Territorial Bill Passed"
 td.11.d:0 "The selected region has a claim and recorded domestic approval. This bill adds no extra infamy and does not transfer sovereignty. Diplomacy and warfare continue under vanilla rules; ratified building commitments remain binding."
 td.12.t:0 "Ratified: Admission Amendment for [SCOPE.sState('td_notice_target').GetName]"
 td.12.d:0 "Only [SCOPE.sState('td_notice_target').GetName] receives legal ratification. Its one-year administrative project starts when budget and the project slot permit; otherwise approval waits for funding. Culture, acceptance, radicals and loyalists are not changed automatically. Building commitments still require actual delivery."
 td.13.t:0 "Territorial Bill Rejected"
 td.13.d:0 "Three failures have accumulated. Territorial bills are blocked for two years. Unratified commitments release their planning reserves; survey expenses are not refunded. Previously ratified commitments remain binding."
 td.14.t:0 "Territorial Bill Withdrawn"
 td.14.d:0 "The bill was withdrawn, or its target or legislative eligibility became invalid. A two-year cooldown applies. Unratified planning reserves are released without survey refunds; previously ratified commitments persist."
 td.15.t:0 "One-Year Integration Completed: [SCOPE.sState('td_notice_target').GetName]"
 td.15.d:0 "[SCOPE.sState('td_notice_target').GetName] has completed one calendar year of funded legal integration and is now incorporated. Its ratified admission record remains attached to this state and owner. Other states are unaffected."
 td.17.t:0 "Construction Pledge Fulfilled"
 td.17.d:0 "The target state’s net building increase fulfills the commitment. The relevant group grants limited temporary approval, and the planning reserve is released. No free throughput or legitimacy is granted."
 td.18.t:0 "Construction Pledge Broken"
 td.18.d:0 "The sovereign target state did not fulfill its commitment by the delivery deadline. The relevant group’s government approval and future bargaining trust fall. Planning reserves are released; reloads, loss of territory and doctrine changes never extend the original deadline."
 td_select_owned:0 "Propose an Individual Territorial Admission Amendment"
 td_select_owned_desc:0 "Browse owned unincorporated non-homeland states, including your portion of a split state. Submit one named amendment at a time. Ratification gives only that state a funded one-year integration route, without requiring prior cultural acceptance. Treaty ports first need ordinary territorial sovereignty."
 td_renounce_lost:0 "Relinquish a Lost Territorial Claim"
 td_renounce_lost_desc:0 "Select a wholly lost state region with an existing claim or primary-cultural homeland. Passage removes its claim and records renunciation; homelands remain. Owned or previously renounced regions are ineligible."
 td_select_integration:0 "Fund One Ratified State’s One-Year Integration"
 td_select_integration_desc:0 "Select one state whose admission amendment has passed and reserve its annual administrative cost. Only that state completes integration after one calendar year. There is no cultural acceptance threshold or turmoil delay."
 td_requires_admission:0 "Individual Admission Amendment Required"
 td.19.t:0 "Lost Claim Relinquished"
 td.19.d:0 "The claim to [SCOPE.sState('td_notice_target').GetName]’s region has been relinquished and the decision recorded. This mod does not automatically restore it through historical rights. Cultural homelands and current sovereignty are unchanged."
 td.20.t:0 "Territorial Bill for [ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]"
 td.20.d:0 "Selected state: [ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]. Choose a valid argument or browse another target. Admission reviews only this owned state and offers a funded one-year administrative project after ratification. Distant claims require a vanilla regional interest. Selecting an argument does not begin deliberation."
 td.21.t:0 "Review One-State Bill"
 td.21.d:0 "Review this target, argument and costs. After submission, negotiate a round every 90 days; three successes pass and three failures reject. Domestic approval adds no extra infamy or free attributes. Admission still needs its one-year administrative reserve; construction uses additional vanilla costs."
 td.22.t:0 "Fund Admission Amendment Integration: [ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]"
 td.22.d:0 "This state needs its own ratified amendment and enough bureaucracy for its annual reserve. Once funded, it completes after one calendar year. Population, turmoil and devastation affect the quoted budget; cultural acceptance does not set the deadline or budget multiplier."
 td.next_state:0 "Browse Next Candidate State"
 td.cancel_menu:0 "Do Not Submit"
 td.change_reason:0 "Choose Another Justification"
 td.submit_bill:0 "Submit Only This State’s Bill"
 td.fast_track:0 "Fund This State’s One-Year Legal Integration"
 td.reason.security:0 "Border and Sea Lane Security"
 td.reason.historical_right:0 "Existing Legal Rights"
 td.reason.equal_rights:0 "Equal Rights for Residents"
 td.reason.civil_administration:0 "Formal Civil Administration"
 td.reason.peace_settlement:0 "Border Recognition and Peace Settlement"
 td_enable_doctrine:0 "Enable National Territorial Doctrine"
 td_enable_doctrine_desc:0 "This decision confirms that the mod is loaded. Enable domestic territorial deliberation, individual admission and colonial political arguments for this save. AI cannot activate it, and this test save has no disable action. Diplomacy and warfare retain vanilla rules."
 td_mod_status:0 "Territorial Doctrine: Installation and Policy Status"
 td_mod_status_desc:0 "Shows whether this loaded mod is enabled, and its colonial and humanitarian policy values. English is the default fallback; the game language selects localization."
 td_select_claim:0 "Select One Territorial Claim or War Mandate"
 td_select_claim_desc:0 "Browse eligible foreign states, select a supported argument and deliberate individually. Existing vanilla claims can also receive domestic approval. Distant targets use vanilla regional interests; there is no separate focus-maturity wait or additional claim infamy."
 td.23.t:0 "Territorial Doctrine Enabled"
 td.23.d:0 "The system is enabled: domestic negotiation, funded building commitments and individual one-year administrative integration. It grants no fixed industrial, population, legitimacy, infamy or exhaustion modifiers. Diplomacy and warfare use vanilla rules."
 td.24.t:0 "National Territorial Doctrine Activated"
 td.24.d:0 "Territorial Doctrine is enabled. Select a target and argument, then submit a bill. Negotiate a round every 90 days. A funded one-year integration no longer freezes other bills; one funded integration project is supported at a time."
 td.26.t:0 "Mod Loaded — Territorial Doctrine Disabled"
 td.26.d:0 "The mod is loaded, but the law group, admission checks and colonial deliberation are disabled. Use Enable National Territorial Doctrine to activate them for this save. Game settings select the language; untranslated catalogs use English."
 td.designate_focus:0 "Designate This Target’s Focus Region"
 td.reason.colonial_development:0 "Colonial Development and Settlement"
 td.reason.regional_interest:0 "Strategic Regional Interests"
 je_td_admission_amendment:0 "Admission Amendment: [ROOT.GetCountry.MakeScope.Var('td_bill_target').GetState.GetName]"
 je_td_admission_amendment_reason:0 "This amendment concerns only the owned state [ROOT.GetCountry.MakeScope.Var('td_bill_target').GetState.GetName], including a split state. Three successful political rounds ratify it. It establishes a state-specific legal admission record and a funded one-year integration project. Other states require separate amendments; cultural acceptance is not a prerequisite."
 td_admission_ratified:0 "This State’s Admission Amendment Ratified"
 td_annual_integration:0 "This State’s One-Year Legal Integration"
 td.30.t:0 "Review Admission Amendment: [ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]"
 td.30.d:0 "This is an independent admission amendment for this state, with one negotiation round every 90 days. Ratification allows its funded one-year integration; other states need their own bills. Resident rights depend on actual citizenship and religious laws, not the chosen argument alone."
 td.31.t:0 "No Eligible Territorial Target"
 td.31.d:0 "No eligible target is currently available, or the selected state has changed. Review your territorial doctrine, regional interests and the state’s ownership, then use the decisions menu to select an eligible target again. No bill was submitted and no administrative reserve was charged."

 td_negotiate:0 "Resume This Round of Territorial Negotiation"

 td_negotiate_desc:0 "Reopen this bill’s current negotiation. Fund a commitment, resolve the round or withdraw for its fixed target. Closing the window does not cast a vote."

 td.32.t:0 "Domestic Negotiation for [SCOPE.sState('td_negotiation_target').GetName]"

 td.32.d:0 "Successes/failures: [ROOT.GetCountry.MakeScope.Var('td_successes').GetValue]/[ROOT.GetCountry.MakeScope.Var('td_failures').GetValue]. Supporting/opposing clout: [ROOT.GetCountry.MakeScope.Var('td_support').GetValue]/[ROOT.GetCountry.MakeScope.Var('td_opposition').GetValue]. This round’s chance: [ROOT.GetCountry.MakeScope.Var('td_chance').GetValue]%. Pay survey expenses and reserve 10 bureaucracy for a railway or naval base commitment, or proceed with your existing coalition or withdraw. Each survey costs population x0.01, minimum 5,000, and is nonrefundable. Actual construction uses vanilla budgets. Railways require railway technology; naval bases require a coast. If you already own part of a foreign target region, acquire ordinary sovereignty and negotiate through its admission bill to avoid crediting the original portion."

 td.negotiate.navy:0 "Fund naval-base planning"

 td.negotiate.railway:0 "Fund railway planning"

 td.negotiate.details:0 "Review each group’s interests and score"

 td.negotiate.continue:0 "Proceed with this coalition"

 td.negotiate.withdraw:0 "Withdraw and release unratified reserves"

 td.negotiate.return:0 "Return to negotiation"

 td.33.t:0 "Interest-Group Ledger for This Bill"

 td.33.d:0 "These are tunable political parameters, not historical approval rates. Unassessed resource returns, casualties and wage pledges earn no support. Scores >=20 strongly support; 5–19 support; -4–4 neutral; -19–-5 oppose; <=-20 strongly oppose.\n\nArmed Forces — Total: [ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_score').GetValue]; Initial: [ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_base').GetValue]; Colonial: [ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_colonial').GetValue]; Argument/burden: [ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_target').GetValue]; Government relationship: [ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_trust').GetValue]; Leader: [ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_leader').GetValue]; Funded commitment: [ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_funded').GetValue]; Breach: [ROOT.GetCountry.MakeScope.Var('td_view_armed_forces_component_breach').GetValue]\n\nLandowners — Total: [ROOT.GetCountry.MakeScope.Var('td_view_landowners_score').GetValue]; Initial: [ROOT.GetCountry.MakeScope.Var('td_view_landowners_component_base').GetValue]; Colonial: [ROOT.GetCountry.MakeScope.Var('td_view_landowners_component_colonial').GetValue]; Argument/burden: [ROOT.GetCountry.MakeScope.Var('td_view_landowners_component_target').GetValue]; Government relationship: [ROOT.GetCountry.MakeScope.Var('td_view_landowners_component_trust').GetValue]; Leader: [ROOT.GetCountry.MakeScope.Var('td_view_landowners_component_leader').GetValue]; Funded commitment: [ROOT.GetCountry.MakeScope.Var('td_view_landowners_component_funded').GetValue]; Breach: [ROOT.GetCountry.MakeScope.Var('td_view_landowners_component_breach').GetValue]\n\nIndustrialists — Total: [ROOT.GetCountry.MakeScope.Var('td_view_industrialists_score').GetValue]; Initial: [ROOT.GetCountry.MakeScope.Var('td_view_industrialists_component_base').GetValue]; Colonial: [ROOT.GetCountry.M