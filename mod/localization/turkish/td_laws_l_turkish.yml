l_turkish:
 lawgroup_territorial_doctrine:0 "National Territorial Doctrine"
 lawgroup_territorial_doctrine_desc:0 "Choose a lasting policy of restraint, lawful restoration, strategic frontiers or imperial expansion. Each doctrine frames arguments and group preferences; actual interests and funded commitments are negotiated in individual bills."
 law_td_status_quo:0 "Territorial Status Quo"
 law_td_status_quo_desc:0 "Preserve existing borders and direct political and administrative resources toward domestic development. This doctrine frames territorial arguments and group preferences; it grants no direct production, political-strength or legitimacy bonus.\n\nClaim eligibility: Does not propose territorial claims; owned states may still be admitted individually and lost claims relinquished.\nInitial preferences: Support: Petty Bourgeoisie, Intelligentsia, Trade Unions, Rural Folk; Neutral: Landowners, Industrialists, Devout; Oppose: Armed Forces. Actual support also reflects arguments, colonial policy, humanitarian research, government approval, leader ideology, funded commitments and breaches. No free industrial, construction, migration, population or national attribute modifiers; no extra infamy or exhaustion. Negotiation occurs every 90 days: three successes pass, three failures reject. Admission still reviews and funds one state for a one-year incorporation project."
 td_territory_status_quo:0 "Territorial Status Quo — Territorial Development"
 law_td_historical_rights:0 "Historical Rights"
 law_td_historical_rights_desc:0 "Ground national borders in existing legal claims and primary-cultural homelands, placing lawful restoration ahead of unrestricted expansion. This doctrine frames territorial arguments and group preferences; it grants no direct production, political-strength or legitimacy bonus.\n\nClaim eligibility: Foreign targets require an existing real claim or a primary-cultural homeland; a focus region does not create historical rights.\nInitial preferences: Strongly support: Petty Bourgeoisie; Support: Armed Forces, Landowners, Devout; Neutral: Industrialists, Intelligentsia, Trade Unions, Rural Folk. Actual support also reflects arguments, colonial policy, humanitarian research, government approval, leader ideology, funded commitments and breaches. No free industrial, construction, migration, population or national attribute modifiers; no extra infamy or exhaustion. Negotiation occurs every 90 days: three successes pass, three failures reject. Admission still reviews and funds one state for a one-year incorporation project."
 td_focus_historical_rights:0 "Historical Rights — Focus Region Commitments"
 td_territory_historical_rights:0 "Historical Rights — Territorial Development"
 law_td_strategic_frontiers:0 "Strategic Frontiers"
 law_td_strategic_frontiers_desc:0 "Pursue limited expansion to secure borders and regional interests. This doctrine frames territorial arguments and group preferences; it grants no direct production, political-strength or legitimacy bonus.\n\nClaim eligibility: Claims cover adjacent states, or distant targets with a vanilla regional interest and a qualifying colonial or sea-lane security basis.\nInitial preferences: Strongly support: Armed Forces; Support: Industrialists, Petty Bourgeoisie; Neutral: Landowners, Devout; Oppose: Intelligentsia, Trade Unions, Rural Folk. Actual support also reflects arguments, colonial policy, humanitarian research, government approval, leader ideology, funded commitments and breaches. No free industrial, construction, migration, population or national attribute modifiers; no extra infamy or exhaustion. Negotiation occurs every 90 days: three successes pass, three failures reject. Admission still reviews and funds one state for a one-year incorporation project."
 td_focus_strategic_frontiers:0 "Strategic Frontiers — Focus Region Commitments"
 td_territory_strategic_frontiers:0 "Strategic Frontiers — Territorial Development"
 law_td_imperial_expansion:0 "Imperial Expansion"
 law_td_imperial_expansion_desc:0 "Make overseas expansion and national prestige a permanent state mission. This doctrine frames territorial arguments and group preferences; it grants no direct production, political-strength or legitimacy bonus.\n\nClaim eligibility: Eligible foreign states in regions with a vanilla regional interest may be claimed; each target still needs its own approved bill.\nInitial preferences: Support: Armed Forces, Landowners, Industrialists; Neutral: Petty Bourgeoisie, Devout; Oppose: Rural Folk; Strongly oppose: Intelligentsia, Trade Unions. Actual support also reflects arguments, colonial policy, humanitarian research, government approval, leader ideology, funded commitments and breaches. No free industrial, construction, migration, population or national attribute modifiers; no extra infamy or exhaustion. Negotiation occurs every 90 days: three successes pass, three failures reject. Admission still reviews and funds one state for a one-year incorporation project."
 td_focus_imperial_expansion:0 "Imperial Expansion — Focus Region Commitments"
 td_territory_imperial_expansion:0 "Imperial Expansion — Territorial Development"
 td_success_admission:0 "Political Credit for Completed State Admission"
 ideology_td_armed_forces:0 "Armed Forces Territorial Position"
 ideology_td_armed_forces_desc:0 "Prioritize defense deployments and military influence, favoring strategic frontiers over policies that restrain the military agenda.\nBase positions: Territorial Status Quo: Oppose; Historical Rights: Support; Strategic Frontiers: Strongly support; Imperial Expansion: Support. Individual bills also account for targets and pledges."
 ideology_td_landowners:0 "Landowners Territorial Position"
 ideology_td_landowners_desc:0 "Defend landed wealth, traditional rights and elite standing, favoring historical claims and imperial expansion.\nBase positions: Territorial Status Quo: Neutral; Historical Rights: Support; Strategic Frontiers: Neutral; Imperial Expansion: Support. Individual bills also account for targets and pledges."
 ideology_td_industrialists:0 "Industrialists Territorial Position"
 ideology_td_industrialists_desc:0 "Seek external markets and investment opportunities, favoring frontier and imperial expansion while weighing colonial commercial policy.\nBase positions: Territorial Status Quo: Neutral; Historical Rights: Neutral; Strategic Frontiers: Support; Imperial Expansion: Support. Individual bills also account for targets and pledges."
 ideology_td_petty_bourgeoisie:0 "Petty Bourgeoisie Territorial Position"
 ideology_td_petty_bourgeoisie_desc:0 "Emphasize national identity and lawful borders, preferring historical rights while supporting limited frontier policies.\nBase positions: Territorial Status Quo: Support; Historical Rights: Strongly support; Strategic Frontiers: Support; Imperial Expansion: Neutral. Individual bills also account for targets and pledges."
 ideology_td_intelligentsia:0 "Intelligentsia Territorial Position"
 ideology_td_intelligentsia_desc:0 "Prioritize residents’ rights and domestic reform, favoring the status quo over imperial expansion; humanitarian research encourages admission.\nBase positions: Territorial Status Quo: Support; Historical Rights: Neutral; Strategic Frontiers: Oppose; Imperial Expansion: Strongly oppose. Individual bills also account for targets and pledges."
 ideology_td_trade_unions:0 "Trade Unions Territorial Position"
 ideology_td_trade_unions_desc:0 "Prioritize labor rights and public services, resisting expansion that diverts domestic resources and supporting equal rights for new residents.\nBase positions: Territorial Status Quo: Support; Historical Rights: Neutral; Strategic Frontiers: Oppose; Imperial Expansion: Strongly oppose. Individual bills also account for targets and pledges."
 ideology_td_rural_folk:0 "Rural Folk Territorial Position"
 ideology_td_rural_folk_desc:0 "Prioritize rural livelihoods and limited conscription, favoring restraint over the war and fiscal burdens of sustained expansion.\nBase positions: Territorial Status Quo: Support; Historical Rights: Neutral; Strategic Frontiers: Oppose; Imperial Expansion: Oppose. Individual bills also account for targets and pledges."
 ideology_td_devout:0 "Devout Territorial Position"
 ideology_td_devout_desc:0 "Value traditional communities and historical legitimacy, favoring historical rights while responding to colonial and humanitarian policy.\nBase positions: Territorial Status Quo: Neutral; Historical Rights: Support; Strategic Frontiers: Neutral; Imperial Expansion: Neutral. Individual bills also account for targets and pledges."
