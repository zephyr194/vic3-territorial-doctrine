l_english:
 lawgroup_territorial_doctrine:0 "National Territorial Doctrine"
 lawgroup_territorial_doctrine_desc:0 "Choose a lasting policy of restraint, lawful restoration, strategic frontiers or imperial expansion. Each doctrine changes interest-group political strength, national benefits and governance burdens, and defines eligibility for individual territorial bills."
 law_td_status_quo:0 "Territorial Status Quo"
 law_td_status_quo_desc:0 "Preserve existing borders and direct political and administrative resources toward domestic development. Civilian reformers, organized labor and rural communities gain influence over the military expansion agenda. Administration improves at the expense of international prestige.\n\nInterest-group political strength: Intelligentsia +10%, Trade Unions +10%, Rural Folk +10%, Armed Forces -10%.\nNational effects: Bureaucracy +5%, Prestige -5%, Infamy decay +15%, Base legitimacy +5.\nIndustry throughput: Paper Mills +5%, Food Industries +5%, Textile Mills +5%. Throughput increases both input demand and output.\nOwned newly acquired and non-homeland states: Construction efficiency +5%, Migration attraction +15%; vanilla migration laws apply.\nClaim eligibility: Does not propose territorial claims; owned states may still be admitted individually and lost claims relinquished.\nBase positions: Support: Petty Bourgeoisie, Intelligentsia, Trade Unions, Rural Folk; Neutral: Landowners, Industrialists, Devout; Oppose: Armed Forces. Colonial policy and humanitarian research adjust positions.\nNo expansion focus regions. Base additional new-claim infamy 0, adjusted by this law’s infamy factor; individual integration base cost x0.8. Ratified admission amendments give their funded state a one-year integration project."
 td_territory_status_quo:0 "Territorial Status Quo — Territorial Development"
 law_td_historical_rights:0 "Historical Rights"
 law_td_historical_rights_desc:0 "Ground national borders in existing legal claims and primary-cultural homelands, placing lawful restoration ahead of unrestricted expansion. National-minded middle classes, landed elites and religious authorities gain influence, strengthening state authority and the traditional interests that can resist reform.\n\nInterest-group political strength: Petty Bourgeoisie +15%, Landowners +10%, Devout +10%.\nNational effects: Authority +25, Infamy generation -10%, Infamy decay +5%, Base legitimacy +5.\nIndustry throughput: Agriculture +5%, Logging +5%. Throughput increases both input demand and output.\nOwned newly acquired and non-homeland states: Construction efficiency +10%, Migration attraction +10%; vanilla migration laws apply.\nClaim eligibility: Foreign targets require an existing real claim or a primary-cultural homeland; a focus region does not create historical rights.\nBase positions: Strongly support: Petty Bourgeoisie; Support: Armed Forces, Landowners, Devout; Neutral: Industrialists, Intelligentsia, Trade Unions, Rural Folk. Colonial policy and humanitarian research adjust positions.\nFocus limit 1; reserve 25 bureaucracy and 0 authority per region; maturity after 6 months. Base additional new-claim infamy 0, adjusted by this law’s infamy factor; individual integration base cost x0.8. Ratified admission amendments give their funded state a one-year integration project."
 td_focus_historical_rights:0 "Historical Rights — Focus Region Commitments"
 td_territory_historical_rights:0 "Historical Rights — Territorial Development"
 law_td_strategic_frontiers:0 "Strategic Frontiers"
 law_td_strategic_frontiers_desc:0 "Pursue limited expansion to secure borders and regional interests. Military planners and industrial sponsors gain political influence, and diplomacy gains room to maneuver. Higher military supply costs and weaker rural representation are the domestic price.\n\nInterest-group political strength: Armed Forces +15%, Industrialists +10%, Rural Folk -10%.\nNational effects: Diplomatic play maneuvers +10, Military goods cost +5%, Infamy generation +10%, Base legitimacy +2.\nIndustry throughput: Steel Mills +5%, Tooling Workshops +5%, Arms Industries +5%, Munition Plants +5%, Shipyards +5%. Throughput increases both input demand and output.\nOwned newly acquired and non-homeland states: Construction efficiency +15%, Migration attraction +5%; vanilla migration laws apply.\nClaim eligibility: Claims cover adjacent states, or distant targets with a vanilla regional interest, mature focus and a qualifying colonial or sea-lane security basis.\nBase positions: Strongly support: Armed Forces; Support: Industrialists, Petty Bourgeoisie; Neutral: Landowners, Devout; Oppose: Intelligentsia, Trade Unions, Rural Folk. Colonial policy and humanitarian research adjust positions.\nFocus limit 2; reserve 50 bureaucracy and 25 authority per region; maturity after 6 months. Base additional new-claim infamy 2, adjusted by this law’s infamy factor; individual integration base cost x1.0. Ratified admission amendments give their funded state a one-year integration project."
 td_focus_strategic_frontiers:0 "Strategic Frontiers — Focus Region Commitments"
 td_territory_strategic_frontiers:0 "Strategic Frontiers — Territorial Development"
 law_td_imperial_expansion:0 "Imperial Expansion"
 law_td_imperial_expansion_desc:0 "Make overseas expansion and national prestige a permanent state mission. Military, industrial and landed interests gain at the expense of civilian reformers, labor and rural communities. Imperial prestige rises, while military supplies cost more and overseas commitments strain bureaucracy.\n\nInterest-group political strength: Armed Forces +20%, Industrialists +15%, Landowners +10%, Intelligentsia -10%, Trade Unions -10%, Rural Folk -10%.\nNational effects: Prestige +10%, Military goods cost +10%, Bureaucracy -5%, Infamy generation +25%, Base legitimacy -5.\nIndustry throughput: Coal Mines +10%, Iron Mines +10%, Lead Mines +10%, Sulfur Mines +10%, Steel Mills +10%, Tooling Workshops +10%, Chemical Plants +10%, Motor Industries +10%, Arms Industries +10%, Munition Plants +10%, War Machine Industries +10%, Shipyards +10%. Throughput increases both input demand and output.\nOwned newly acquired and non-homeland states: Construction efficiency +20%, Migration attraction +10%; vanilla migration laws apply.\nClaim eligibility: Eligible foreign states in mature focus regions with a vanilla regional interest may be claimed; each target still needs its own approved bill.\nBase positions: Support: Armed Forces, Landowners, Industrialists; Neutral: Petty Bourgeoisie, Devout; Oppose: Rural Folk; Strongly oppose: Intelligentsia, Trade Unions. Colonial policy and humanitarian research adjust positions.\nFocus limit 3; reserve 75 bureaucracy and 50 authority per region; maturity after 12 months. Base additional new-claim infamy 5, adjusted by this law’s infamy factor; individual integration base cost x1.25. Ratified admission amendments give their funded state a one-year integration project."
 td_focus_imperial_expansion:0 "Imperial Expansion — Focus Region Commitments"
 td_territory_imperial_expansion:0 "Imperial Expansion — Territorial Development"
 ideology_td_armed_forces:0 "Armed Forces Territorial Position"
 ideology_td_armed_forces_desc:0 "Prioritize defense deployments and military influence, favoring strategic frontiers over policies that restrain the military agenda.\nBase positions: Territorial Status Quo: Oppose; Historical Rights: Support; Strategic Frontiers: Strongly support; Imperial Expansion: Support. Individual bills also account for targets and pledges."
 ideology_td_landowners:0 "Landowners Territorial Position"
 ideology_td_landowners_desc:0 "Defend landed wealth, traditional rights and elite standing, favoring historical claims and imperial expansion.\nBase positions: Territorial Status Quo: Neutral; Historical Rights: Support; Strategic Frontiers: Neutral; Imperial Expansion: Support. Individual bills also account for targets and pledges."
 ideology_td_industrialists:0 "Industrialists Territorial Position"
 ideology_td_industrialists_desc:0 "Seek external markets and investment opportunities, favoring frontier and imperial expansion while weighing colonial commercial policy.\nBase positions: Territorial Status Quo: Neutral; Historical Rights: Neutral; Strategic Frontiers: Support; Imperial Expansion: Support. Individual bills also account for targets and pledges."
 ideology_td_petty_bourgeoisie:0 "Petty Bourgeoisie Territorial Position"
 ideology_td_petty_bourgeoisie_desc:0 "Emphasize national identity and lawful borders, preferring historical rights while supporting limited frontier policies.\nBase positions: Territorial Status Quo: Support; Historical Rights: Strongly support; Strategic Frontiers: Support; Imperial Expansion: Neutral. Individual bills also account for targets and pledges."
 ideology_td_intelligentsia:0 "Intelligentsia Territorial Position"
 ideology_td_intelligentsia_desc:0 "Prioritize residents’ rights and domestic reform, favoring the status quo over imperial expansion; humanitarian research encourages admission.\nBase positions: Territorial Status Quo: Support; Historical Rights: Neutral; Strategic Frontiers: Oppose; Imperial Expansion: Strongly oppose. Individual bills also account for targets and pledges."
 ideology_td_trade_unions:0 "Trade Unions Territorial Position"
 ideology_td_trade_unions_desc:0 "Prioritize labor rights and public services, resisting expansion that diverts domestic resources and supporting equal rights for new residents.\nBase positions: Territorial Status Quo: Support; Historical Rights: Neutral; Strategic Frontiers: Oppose; Imperial Expansion: Strongly oppose. Individual bills also account for targets and pledges."
 ideology_td_rural_folk:0 "Rural Folk Territorial Position"
 ideology_td_rural_folk_desc:0 "Prioritize rural livelihoods and limited conscription, favoring restraint over the war and fiscal burdens of sustained expansion.\nBase positions: Territorial Status Quo: Support; Historical Rights: Neutral; Strategic Frontiers: Oppose; Imperial Expansion: Oppose. Individual bills also account for targets and pledges."
 ideology_td_devout:0 "Devout Territorial Position"
 ideology_td_devout_desc:0 "Value traditional communities and historical legitimacy, favoring historical rights while responding to colonial and humanitarian policy.\nBase positions: Territorial Status Quo: Neutral; Historical Rights: Support; Strategic Frontiers: Neutral; Imperial Expansion: Neutral. Individual bills also account for targets and pledges."
