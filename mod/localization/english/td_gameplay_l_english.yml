l_english:
 td_journal_group:0 "Territorial Legislation"
 je_td_bill:0 "Al Rif Territorial Bill"
 je_td_bill_reason:0 "A checkpoint occurs every 90 days: three successes pass, three failures reject.\nSuccesses: [ROOT.GetCountry.MakeScope.Var('td_successes').GetValue]; failures: [ROOT.GetCountry.MakeScope.Var('td_failures').GetValue].\nUse decisions to inspect support, offer pledges or withdraw."
 je_td_integration:0 "Al Rif Administrative Integration"
 je_td_integration_reason:0 "Fast track requires 12 eligible months; six consecutive ineligible months return it to regular incorporation.\nEligible months: [ROOT.GetCountry.MakeScope.Var('td_valid_months').GetValue]; consecutive ineligible: [ROOT.GetCountry.MakeScope.Var('td_invalid_months').GetValue].\nStart regular incorporation manually in the vanilla state UI. Cultures and religions remain."
 td_focus_north_africa:0 "Designate a North African Focus"
 td_focus_north_africa_desc:0 "Requires an existing regional interest. Reserves bureaucracy and authority according to doctrine; waits six or twelve months. Alpha exposes one focus. Historical Rights does not create historical rights to Al Rif."
 td_remove_focus:0 "Withdraw North African Focus"
 td_remove_focus_desc:0 "Releases reserved resources. Unavailable during a bill. Designating it again restarts the waiting period."
 td_claim_al_rif:0 "Propose an Al Rif Claim Bill"
 td_claim_al_rif_desc:0 "Use Strait of Gibraltar security as the justification. Alpha requires Moroccan ownership, Strategic Frontiers or Imperial Expansion, and a ready focus. Does not transfer land."
 td_admit_al_rif:0 "Propose Formal Admission of Al Rif"
 td_admit_al_rif_desc:0 "Requires sovereignty over the entire state region. Wartime occupation is insufficient. Admission does not remove cultural or religious discrimination."
 td_pledge_navy:0 "Pledge to Expand Al Rif Naval Bases"
 td_pledge_navy_desc:0 "Armed Forces support score +10. Following passage, add at least one net naval base level within three years of full acquisition, measured against acquisition levels. Breach: approval -5 and future bill score -10 for five years. An outstanding pledge to this group blocks a duplicate."
 td_pledge_railway:0 "Pledge to Expand Al Rif Railways"
 td_pledge_railway_desc:0 "Industrialists support score +10. Following passage, add at least one net railway level within three years of full acquisition, measured against acquisition levels. Breach: approval -5 and future bill score -10 for five years. An outstanding pledge to this group blocks a duplicate."
 td_bill_status:0 "Inspect Territorial Bill Support"
 td_bill_status_desc:0 "Recalculates positions and next-round probability without advancing or rerolling a checkpoint."
 td_cancel_bill:0 "Withdraw Territorial Bill"
 td_cancel_bill_desc:0 "Clears the active bill and imposes a two-year cooldown. Pledges from previously passed bills remain binding."
 td_fast_integration:0 "Start One-Year Al Rif Integration"
 td_fast_integration_desc:0 "Requires legitimacy 60+, nonnegative bureaucracy after payment, turmoil below 20%, devastation below 10%, market access 90%+, and 80% of residents fully accepted with undiscriminated religion. Reserves double project cost and incorporates after 12 eligible months."
 td_regular_integration:0 "Choose Regular Al Rif Integration"
 td_regular_integration_desc:0 "Reserves regular project bureaucracy. Then start incorporation manually in the vanilla state UI; normal speed applies."
 td_refresh_integration:0 "Refresh Al Rif Acceptance Check"
 td_refresh_integration_desc:0 "Reads actual pop acceptance and religious discrimination now. Otherwise refreshed monthly."
 td_project_cost:0 "Territorial Integration Project Cost"
 td_pledge_fulfilled:0 "Territorial Pledge Fulfilled"
 td_pledge_broken:0 "Territorial Pledge Broken"
 td.flavor:0 "Domestic legislation does not replace sovereignty, diplomacy or residents' actual rights."
 td.close:0 "Acknowledged"
 td.10.t:0 "Territorial Bill Support"
 td.10.d:0 "Supporting clout: [ROOT.GetCountry.MakeScope.Var('td_support').GetValue]%\nOpposing clout: [ROOT.GetCountry.MakeScope.Var('td_opposition').GetValue]%\nNext-round chance: [ROOT.GetCountry.MakeScope.Var('td_chance').GetValue]%\nSuccesses: [ROOT.GetCountry.MakeScope.Var('td_successes').GetValue]; failures: [ROOT.GetCountry.MakeScope.Var('td_failures').GetValue]. Checkpoints every 90 days; three successes pass, three failures reject."
 td.11.t:0 "Al Rif Claim Bill Passed"
 td.11.d:0 "A claim on Al Rif was added and additional infamy charged. Diplomatic plays, war-goal infamy and acquisition remain vanilla. Passed construction pledges begin their deadlines after full acquisition."
 td.12.t:0 "Al Rif Admission Passed"
 td.12.d:0 "Choose regular incorporation, or the one-year fast track once actual governance and acceptance requirements are satisfied. Admission changes no cultures, religions or acceptance levels."
 td.13.t:0 "Territorial Bill Rejected"
 td.13.d:0 "Three failures have accumulated. Territorial bills are blocked for two years. Pledges from this rejected bill create no obligations; previously passed pledges persist."
 td.14.t:0 "Territorial Bill Withdrawn"
 td.14.d:0 "The bill was withdrawn, or its target or legislative eligibility became invalid. A two-year cooldown applies. Previously passed pledges persist."
 td.15.t:0 "Al Rif Integrated"
 td.15.d:0 "After 12 eligible months, Al Rif is incorporated and project bureaucracy released. Cultures and religions remain; passed construction pledges continue to be tracked."
 td.16.t:0 "Fast Track Returned to Regular Incorporation"
 td.16.d:0 "Governance requirements failed for six consecutive months. Regular project cost is now reserved. Start incorporation in the vanilla state UI. This project cannot immediately restart the fast track."
 td.17.t:0 "Construction Pledge Fulfilled"
 td.17.d:0 "The corresponding Al Rif building gained at least one net level since acquisition. The associated group gains +2 approval for three years."
 td.18.t:0 "Construction Pledge Broken"
 td.18.d:0 "The building expansion was not completed within three years of full acquisition. The group receives -5 approval and -10 on future bill scores for five years. Losing land or changing doctrine does not reset the deadline."
