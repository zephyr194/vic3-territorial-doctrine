l_korean:
 td_enable_fiscal_accounting:0 "VTD Permanently Enable Territorial Fiscal Accounting"
 td_enable_fiscal_accounting_desc:0 "VTD Permanently enable this module for all countries in this save, after activating Territorial Doctrine. No disable action. Expansion programs and peaceful budgeting can change; existing contracts and debts persist. Read the actual tax law and weekly funding gap; adjust vanilla tax settings under budget conditions. Actual tax increases affect burden-bearing groups in the current bill."
 td_enable_recruitment_accounting:0 "VTD Permanently Enable Political Recruitment Response"
 td_enable_recruitment_accounting_desc:0 "VTD Permanently enable this module for all countries in this save, after activating Territorial Doctrine. No disable action. Expansion programs and peaceful budgeting can change; existing contracts and debts persist. With an approved expansion program, an expansion doctrine and offensive war leadership, legitimacy adjusts relative conscription potential by at most +/-10%. No modifier in peace or on defense."
 td_enable_services_accounting:0 "VTD Permanently Enable Public-Service Responsibility Accounting"
 td_enable_services_accounting_desc:0 "VTD Permanently enable this module for all countries in this save, after activating Territorial Doctrine. No disable action. Expansion programs and peaceful budgeting can change; existing contracts and debts persist. Read vanilla education/health investment and bureaucracy shortfalls. Actual cuts or administrative shortages enter group deliberation; peaceful budgeting still reports restoration gaps. Actual policy sets institution investment."
 td_civic_accounts:0 "VTD View Territorial Fiscal, Recruitment and Service Accounts"
 td_civic_accounts_desc:0 "VTD Review module flags and observed vanilla budget, tax law, administration and institutions. Figures are current observations, not revenue forecasts. Disabled modules produce no additional effect."
 td_raise_budget_tax:0 "VTD Deficit Budget: Raise Vanilla Tax One Step"
 td_raise_budget_tax_desc:0 "VTD With fiscal accounting and a negative observed weekly balance, raise the actual vanilla tax setting one step. A 30-day adjustment cooldown applies. Vanilla computes revenue and living costs; the current bill reads the increased burden under its tax law."
 td_lower_budget_tax:0 "VTD Surplus Budget: Lower Vanilla Tax One Step"
 td_lower_budget_tax_desc:0 "VTD With a positive observed weekly balance and gold reserves, lower the actual vanilla tax setting one step with a 30-day cooldown. A current surplus does not guarantee a surplus after the cut; check the next vanilla budget. No free support or refund."
 td_return_peace_budget:0 "VTD End Expansion Program and Return to Peaceful Budgeting"
 td_return_peace_budget_desc:0 "VTD End the temporary expansion program and its recruitment modifier; resolve any active claim bill first. Module flags, debts, annual admission and ratified building contracts persist. Another program requires another approved target bill."
 td_conscription_high_trust:0 "VTD Expansion Mobilization: Higher-Legitimacy Recruitment"
 td_conscription_low_trust:0 "VTD Expansion Mobilization: Lower-Legitimacy Recruitment"
 td_conscription_high_trust_desc:0 "VTD An approved expansion program led in an offensive war can add at most 10% relative conscription potential, scaled by legitimacy. No units are automatically raised; military institutions and population still constrain forces."
 td_conscription_low_trust_desc:0 "VTD Under the same mobilization conditions, low legitimacy reduces relative conscription potential by at most 10%. No modifier in peace, on defense or without an approved program."
 td.40.t:0 "VTD Territorial Policy Accounts"
 td.40.d:0 "VTD Permanent modules (1 enabled/0 disabled): fiscal [ROOT.GetCountry.MakeScope.Var('td_account_fiscal_enabled').GetValue], recruitment [ROOT.GetCountry.MakeScope.Var('td_account_recruitment_enabled').GetValue], services [ROOT.GetCountry.MakeScope.Var('td_account_services_enabled').GetValue]. Phase (1 expansion/0 peace): [ROOT.GetCountry.MakeScope.Var('td_civic_phase').GetValue].\n\nVanilla weekly balance: [ROOT.GetCountry.MakeScope.Var('td_weekly_balance').GetValue]; expenses: [ROOT.GetCountry.MakeScope.Var('td_weekly_expenses').GetValue]; funding gap: [ROOT.GetCountry.MakeScope.Var('td_weekly_funding_gap').GetValue]. Tax rank (1 lowest to 5 highest): [ROOT.GetCountry.MakeScope.Var('td_budget_tax_rank').GetValue]; law (0 unknown/1 land/2 per-capita/3 consumption/4 proportional/5 graduated): [ROOT.GetCountry.MakeScope.Var('td_budget_tax_law').GetValue].\n\nAvailable bureaucracy: [ROOT.GetCountry.MakeScope.Var('td_bureaucracy_balance').GetValue]; shortfall: [ROOT.GetCountry.MakeScope.Var('td_bureaucracy_gap').GetValue]; shortfall/usage: [ROOT.GetCountry.MakeScope.Var('td_service_pressure_percent').GetValue]%. Education/health investment: [ROOT.GetCountry.MakeScope.Var('td_service_education').GetValue]/[ROOT.GetCountry.MakeScope.Var('td_service_health').GetValue]; gaps against first accounting: [ROOT.GetCountry.MakeScope.Var('td_service_education_gap').GetValue]/[ROOT.GetCountry.MakeScope.Var('td_service_health_gap').GetValue]. This ratio is budget pressure, not institution efficiency or population coverage.\n\nRecruitment modifier active: [ROOT.GetCountry.MakeScope.Var('td_recruitment_active').GetValue]; relative conscription potential change: [ROOT.GetCountry.MakeScope.Var('td_recruitment_percent').GetValue]%. Vanilla military and institutional expenses are recorded, never charged twice. Population-specific tax burdens and future project returns are unassessed."
