l_spanish:
 td_journal_group:0 "Territorial Legislation"
 je_td_bill:0 "Individual Territorial Bill"
 je_td_bill_reason:0 "Target: [ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]. A checkpoint occurs every 90 days; three successes pass, three failures reject. Successes: [ROOT.GetCountry.MakeScope.Var('td_successes').GetValue]; failures: [ROOT.GetCountry.MakeScope.Var('td_failures').GetValue]. Only this state is processed."
 je_td_integration:0 "Individual State Integration"
 je_td_integration_reason:0 "Target: [ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]. Eligible months: [ROOT.GetCountry.MakeScope.Var('td_valid_months').GetValue]; consecutive ineligible months: [ROOT.GetCountry.MakeScope.Var('td_invalid_months').GetValue]. Twelve eligible months complete the fast track; six consecutive failures return to regular incorporation, started manually in the state UI."
 td_remove_focus:0 "Withdraw All Territorial Focus Regions"
 td_remove_focus_desc:0 "Releases all focus bureaucracy and authority, clears readiness and invalidates old waiting events. Previously approved claims remain recorded. Cannot withdraw during a bill."
 td_claim_al_rif:0 "Propose an Al Rif Claim Bill"
 td_claim_al_rif_desc:0 "Spain’s shortcut to the same individual claim process. A distant target needs a ready North African focus; designate it from the reason menu. Diplomacy and war goals remain vanilla."
 td_pledge_navy:0 "Pledge to Expand Al Rif Naval Bases"
 td_pledge_navy_desc:0 "Armed Forces support score +10. Following passage, add at least one net naval base level within three years of full acquisition, measured against acquisition levels. Breach: approval -5 and future bill score -10 for five years. An outstanding pledge to this group blocks a duplicate."
 td_pledge_railway:0 "Pledge to Expand Al Rif Railways"
 td_pledge_railway_desc:0 "Industrialists support score +10. Following passage, add at least one net railway level within three years of full acquisition, measured against acquisition levels. Breach: approval -5 and future bill score -10 for five years. An outstanding pledge to this group blocks a duplicate."
 td_bill_status:0 "Inspect Territorial Bill Support"
 td_bill_status_desc:0 "Refresh political support. Governance and power structures share a 10% base; institutional adjustments require a matching justification. Viewing does not create a checkpoint."
 td_cancel_bill:0 "Withdraw Territorial Bill"
 td_cancel_bill_desc:0 "Clears the active bill and imposes a two-year cooldown. Pledges from previously passed bills remain binding."
 td_refresh_integration:0 "Refresh Selected State Acceptance"
 td_refresh_integration_desc:0 "Read the selected state's actual acceptance and religious discrimination; cultures and religions are unchanged."
 td_project_cost:0 "Territorial Integration Project Cost"
 td_pledge_fulfilled:0 "Territorial Pledge Fulfilled"
 td_pledge_broken:0 "Territorial Pledge Broken"
 td.flavor:0 "Domestic legislation does not replace sovereignty, diplomacy or residents' actual rights."
 td.close:0 "Acknowledged"
 td.10.t:0 "Territorial Bill Support"
 td.10.d:0 "Target: [ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]. Shared base: 10%. Supporting clout: [ROOT.GetCountry.MakeScope.Var('td_support').GetValue]%; opposition: [ROOT.GetCountry.MakeScope.Var('td_opposition').GetValue]%; next round: [ROOT.GetCountry.MakeScope.Var('td_chance').GetValue]%. Successes: [ROOT.GetCountry.MakeScope.Var('td_successes').GetValue]; failures: [ROOT.GetCountry.MakeScope.Var('td_failures').GetValue]."
 td.11.t:0 "Selected Territorial Bill Passed"
 td.11.d:0 "The selected state region has a claim and recorded legislative approval. New-claim infamy is charged once; confirming an existing claim charges none. An expansion doctrine plus approval of every target is required for an authorized territorial war. Construction pledges, if any, remain binding."
 td.12.t:0 "Selected State Admission Passed"
 td.12.d:0 "Only [ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName] has been admitted. Start and fund its integration project to unlock incorporation. Other states require separate bills. Actual acceptance, cultures, religions and homelands remain unchanged."
 td.13.t:0 "Territorial Bill Rejected"
 td.13.d:0 "Three failures have accumulated. Territorial bills are blocked for two years. Pledges from this rejected bill create no obligations; previously passed pledges persist."
 td.14.t:0 "Territorial Bill Withdrawn"
 td.14.d:0 "The bill was withdrawn, or its target or legislative eligibility became invalid. A two-year cooldown applies. Previously passed pledges persist."
 td.15.t:0 "Selected State Integrated"
 td.15.d:0 "[ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName] completed twelve eligible months and is now incorporated. Project cost is released. Other states' admission and incorporation are unaffected; cultures and religions remain."
 td.16.t:0 "Fast Track Returned to Regular Incorporation"
 td.16.d:0 "The selected state failed fast-track requirements for six consecutive months. Regular cost is now reserved. Start incorporation in the vanilla state UI; another project cannot start until this one ends."
 td.17.t:0 "Construction Pledge Fulfilled"
 td.17.d:0 "The corresponding Al Rif building gained at least one net level since acquisition. The associated group gains +2 approval for three years."
 td.18.t:0 "Construction Pledge Broken"
 td.18.d:0 "The building expansion was not completed within three years of full acquisition. The group receives -5 approval and -10 on future bill scores for five years. Losing land or changing doctrine does not reset the deadline."
 td_select_owned:0 "Process a Non-Homeland State"
 td_select_owned_desc:0 "Select one owned, unincorporated non-homeland state, excluding treaty ports. Passage admits only this state; incorporation unlocks when a funded integration project starts. Colonial policy and humanitarian technology affect group support and cost."
 td_renounce_lost:0 "Relinquish a Lost Territorial Claim"
 td_renounce_lost_desc:0 "Select a wholly lost state region with an existing claim or primary-cultural homeland. Passage removes its claim and records renunciation; homelands remain. Owned or previously renounced regions are ineligible."
 td_select_integration:0 "Select One Admitted State for Integration"
 td_select_integration_desc:0 "Select one individually admitted state and fund its project. Only this state is unlocked for vanilla incorporation. Cost includes doctrine, justification, institutions, local conditions and colonial rights obligations."
 td_requires_admission:0 "Individual Admission Required"
 td.19.t:0 "Lost Claim Relinquished"
 td.19.d:0 "The claim on the state region containing [ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName] was removed and renunciation recorded. This mod will not automatically restore it through historical-rights justification. Homelands and current sovereignty remain unchanged."
 td.20.t:0 "Choose a Territorial Justification"
 td.20.d:0 "Target: [ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]. Choose an eligible reason or browse another candidate. Distant claims require a focus; it reserves resources immediately and waits six or twelve months. Selecting a reason does not start legislation."
 td.21.t:0 "Review One-State Bill"
 td.21.d:0 "Target: [ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]. Shared base 10%; reason adjustment: [ROOT.GetCountry.MakeScope.Var('td_preview_reason_bonus').GetValue] points; additional claim infamy: [ROOT.GetCountry.MakeScope.Var('td_preview_infamy').GetValue]. Estimated regular/fast bureaucracy: [ROOT.GetCountry.MakeScope.Var('td_preview_regular_cost').GetValue]/[ROOT.GetCountry.MakeScope.Var('td_preview_fast_cost').GetValue], reassessed when funded. Colonial expansion/admission tendencies: [ROOT.GetCountry.MakeScope.Var('td_expansion_pull').GetValue]/[ROOT.GetCountry.MakeScope.Var('td_admission_pull').GetValue] (group-score inputs, not probability points). Renunciation starts no project."
 td.22.t:0 "Choose the Selected State Integration Route"
 td.22.d:0 "Target: [ROOT.GetCountry.MakeScope.Var('td_target').GetState.GetName]. Fast track requires legitimacy 60+, nonnegative bureaucracy after payment, turmoil below 20%, devastation below 10%, market access 90%+, and 80% fully accepted residents with undiscriminated religion. Regular incorporation uses vanilla speed."
 td.next_state:0 "Browse Next Candidate State"
 td.cancel_menu:0 "Do Not Submit"
 td.change_reason:0 "Choose Another Justification"
 td.submit_bill:0 "Submit Only This State's Bill"
 td.fast_track:0 "Start One-Year Fast Track"
 td.regular_track:0 "Start Regular Incorporation Project"
 td.reason.security:0 "Border and Sea Lane Security"
 td.reason.historical_right:0 "Existing Legal Rights"
 td.reason.equal_rights:0 "Equal Rights for Residents"
 td.reason.civil_administration:0 "Formal Civil Administration"
 td.reason.peace_settlement:0 "Border Recognition and Peace Settlement"
 td_enable_doctrine:0 "Enable National Territorial Doctrine"
 td_enable_doctrine_desc:0 "The presence of this decision confirms that the mod is loaded. Activate territorial laws, individual admission, colonial politics and war mandates for every country in this save. Disabled by default; AI cannot activate it. Activation is permanent for this test save. Wars already underway are exempt."
 td_mod_status:0 "Territorial Doctrine: Installation and Policy Status"
 td_mod_status_desc:0 "Shows whether this loaded mod is enabled, and its colonial and humanitarian policy values. English is the default fallback; the game language selects localization."
 td_select_claim:0 "Select One Territorial Claim or War Mandate"
 td_select_claim_desc:0 "Browse eligible foreign states individually. Select a supported justification and pass the bill. An existing vanilla claim still needs legislative approval for an expansion mandate, but incurs no new-claim infamy. Distant targets require a funded focus and its waiting period."
 td.23.t:0 "Territorial Doctrine Enabled"
 td.23.d:0 "The mod is loaded and enabled for this save. Humanitarian stage: [ROOT.GetCountry.MakeScope.Var('td_humanitarian_level').GetValue] of 2. Colonial expansion/admission tendencies: [ROOT.GetCountry.MakeScope.Var('td_expansion_pull').GetValue]/[ROOT.GetCountry.MakeScope.Var('td_admission_pull').GetValue]. Conquest and annexation require an expansion doctrine and passed bills for every target. Unauthorized attacking warleaders gain 2 extra exhaustion each month, capped at 20 per war. Defense and return-state wars are exempt."
 td.24.t:0 "National Territorial Doctrine Activated"
 td.24.d:0 "Territorial law and politics are now enabled for every country in this save. Default doctrine is Territorial Status Quo. Admission proceeds one state at a time. Review colonial policy and humanitarian research, and obtain target mandates before starting expansion wars. Wars already underway are exempt. Activation cannot be withdrawn through this interface."
 td.26.t:0 "Mod Loaded — Territorial Doctrine Disabled"
 td.26.d:0 "The mod is loaded. Its law group, admission restrictions, colonial politics and war penalties remain disabled. Use the Enable National Territorial Doctrine decision to activate them for this save. Changing the game language selects text; untranslated language catalogs use English."
 td.designate_focus:0 "Designate This Target’s Focus Region"
 td.reason.colonial_development:0 "Colonial Development and Settlement"
 td.reason.regional_interest:0 "Strategic Interests in a Focus Region"
