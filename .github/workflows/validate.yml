name: Validate mod
on: [push, pull_request]
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows launcher with no Python on PATH
        shell: cmd
        run: |
          set "PATH=%SystemRoot%\System32;%SystemRoot%"
          call vtd.cmd status --mod-dir "%RUNNER_TEMP%\VTD profile\mod"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_launcher.py -v
      - run: python -m unittest discover -s tests -p test_windows_install.py -v
      - run: python -m unittest discover -s tests -p test_install.py -v
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/generate.py --check
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate.py
      - run: python tools/scenario.py
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: territorial-doctrine
          path: dist/*.zip
